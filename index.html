const {useState,useEffect,useRef}=React;

// ===== AUTO-SAVE INDICATOR =====
function AutoSaveIndicator({ status }) {
  if (status === "idle") return null;
  const colors = { saving: "#fbbf24", saved: "#4ade80", error: "#f87171" };
  const texts = { saving: "💾 Salvando...", saved: "✅ Salvo", error: "❌ Erro" };
  return (
    <div style={{
      position: "fixed", bottom: "20px", right: "20px", padding: "8px 12px",
      borderRadius: "6px", fontSize: "12px", fontWeight: "600", zIndex: 9999,
      background: colors[status], color: "#000", boxShadow: "0 2px 10px rgba(0,0,0,0.3)"
    }}>
      {texts[status]}
    </div>
  );
}

function useAutoSave(key, value, debounceMs = 800) {
  const debounceTimerRef = useRef(null);
  const [status, setStatus] = useState("idle");
  useEffect(() => {
    if (!value || (Array.isArray(value) && value.length === 0)) return;
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    setStatus("saving");
    debounceTimerRef.current = setTimeout(async () => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        const url = localStorage.getItem(STORAGE_SHEETS_URL) || DEFAULT_SHEETS_URL;
        if (url && typeof cloudSave === 'function') {
          const ok = await cloudSave(key, value);
          setStatus(ok ? "saved" : "error");
        } else {
          setStatus("saved");
        }
        setTimeout(() => setStatus("idle"), 2000);
      } catch (err) {
        setStatus("error");
        setTimeout(() => setStatus("idle"), 3000);
      }
    }, debounceMs);
    return () => { if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current); };
  }, [key, value]);
  return status;
}
const STORAGE_NF="nfe_v4";
const STORAGE_FR="fretes_v3";
const STORAGE_SHEETS_URL="sheets_url_v1";
const STORAGE_PED_V2 = "pedidos_v2";
const STORAGE_SOL_V2 = "solicitacoes_v1";
const STORAGE_CAL_V1 = "calendario_compras_v1";
const DEFAULT_SHEETS_URL="https://script.google.com/macros/s/AKfycbyeeRKy-2I7m80eiD21lFTd77nOuRC66VmMuT_5B1hm0P0N9eSkGnXHGqHaJMmUfADeCw/exec";
const STORAGE_CACHE_VERSION = "masterepi_cache_version_v1";
const DATA_CACHE_VERSION = "cloud-first-2026-10-06-v1";

// O localStorage é somente cache. Ao publicar uma versão incompatível,
// removemos automaticamente os dados locais antigos, sem apagar a URL da nuvem.
(function migrateLocalCache(){
  try{
    if(localStorage.getItem(STORAGE_CACHE_VERSION)!==DATA_CACHE_VERSION){
      [STORAGE_NF,STORAGE_FR,STORAGE_PED_V2,STORAGE_SOL_V2,STORAGE_CAL_V1]
        .forEach(k=>localStorage.removeItem(k));
      localStorage.setItem(STORAGE_CACHE_VERSION,DATA_CACHE_VERSION);
    }
  }catch(e){ console.warn("Não foi possível atualizar o cache local",e); }
})();

async function cloudSave(key, value){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return false;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),10000);
    const body=new URLSearchParams({key:key,value:JSON.stringify(value)});
    const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString(),signal:ctrl.signal});
    clearTimeout(tid);
    if(!response.ok){console.error("HTTP erro:",response.status);return false;}
    const text=await response.text();
    return text==="ok"||text.includes("ok");
  }catch{return false;}
}
async function cloudUpload(file){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url||!file)return null;
  if(file.size>10*1024*1024)throw new Error("A cotação deve ter no máximo 10 MB");
  const data=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result));
    reader.onerror=()=>reject(new Error("Não foi possível ler o arquivo"));
    reader.readAsDataURL(file);
  });
  const body=new URLSearchParams({action:"upload",name:file.name,mimeType:file.type||"application/octet-stream",data});
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()});
  const text=await r.text();
  if(!r.ok)throw new Error("Falha no upload");
  const result=JSON.parse(text);
  if(!result.ok)throw new Error(result.error||"Falha no upload");
  return result;
}
async function cloudLoad(key){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(`${url}?key=${encodeURIComponent(key)}&ts=${Date.now()}`,{signal:ctrl.signal});
    clearTimeout(tid);
    const text=await r.text();
    if(!text||text==="null"||text.trim()==="")return null;
    return JSON.parse(text);
  }catch{return null;}
}

const AUTO_SYNC_MS = 120000; // 2 minutos
function useAutoCloudSync(key, sheetsUrl, onData){
  const busyRef=useRef(false);
  useEffect(()=>{
    if(!sheetsUrl)return;
    let stopped=false;
    const sync=async()=>{
      if(stopped||busyRef.current||document.visibilityState==="hidden")return;
      busyRef.current=true;
      try{
        const data=await cloudLoad(key);
        if(data!==null && data!==undefined){
          try{localStorage.setItem(key,JSON.stringify(data));}catch{}
          onData(data);
        }
      }finally{busyRef.current=false;}
    };
    const timer=setInterval(sync,AUTO_SYNC_MS);
    const onVisibility=()=>{if(document.visibilityState==="visible")sync();};
    document.addEventListener("visibilitychange",onVisibility);
    return()=>{stopped=true;clearInterval(timer);document.removeEventListener("visibilitychange",onVisibility);};
  },[key,sheetsUrl,onData]);
}

function today(){return new Date().toLocaleDateString("pt-BR");}
function parseDate(str){if(!str)return 0;const[d,m,y]=str.split("/");return new Date(`${y}-${m}-${d}`).getTime()||0;}
function diffDays(a,b){const da=parseDate(a),db=parseDate(b);if(!da||!db)return null;return Math.round((db-da)/86400000);}
function diasAberto(emissao){if(!emissao)return null;const h=new Date();h.setHours(0,0,0,0);const e=parseDate(emissao);return e?Math.floor((h-e)/86400000):null;}
function supplierKey(e){return e?(e.replace(/\(CNPJ:.*?\)/gi,"").trim().toUpperCase().substring(0,40)):"";}
function buildStats(nfs){
  const map={};
  for(const n of nfs){if(!n.emissao||!n.chegou)continue;const d=diffDays(n.emissao,n.chegou);if(d===null||d<0)continue;const k=supplierKey(n.emitente);if(!map[k])map[k]=[];map[k].push(d);}
  const s={};
  for(const[k,a]of Object.entries(map))s[k]={media:Math.round(a.reduce((x,y)=>x+y,0)/a.length),count:a.length};
  return s;
}

    const dups=[...doc.getElementsByTagNameNS(ns,"dup")].map(d=>({nDup:g("nDup",d),dVenc:g("dVenc",d),vDup:fmtVal(g("vDup",d))}));
    const itens=[...doc.getElementsByTagNameNS(ns,"det")].map(det=>{

}

function parseCTe(xmlText){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xmlText,"text/xml");
    const nsCte="http://www.portalfiscal.inf.br/cte";
    const g=(tag,ctx)=>{
      const el=(ctx||doc).getElementsByTagNameNS(nsCte,tag)[0];
      return el?.textContent||"";
    };
    // Número/série
    const nCT=g("nCT"); const serie=g("serie");
    const numero=serie?`${nCT}/${serie}`:nCT;
    // Emissão
    const dhEmi=g("dhEmi")||g("dEmi");
    const emissao=dhEmi?(()=>{const d=new Date(dhEmi);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;})():"";
    // Emitente (transportadora)
    const emitNode=doc.getElementsByTagNameNS(nsCte,"emit")[0];
    const transportadora=g("xNome",emitNode)||"";
    const emitCNPJ=emitNode?.getElementsByTagNameNS(nsCte,"CNPJ")[0]?.textContent||"";
    const enderEmit=emitNode?.getElementsByTagNameNS(nsCte,"enderEmit")[0];
    const origemMun=g("xMun",enderEmit); const origemUF=g("UF",enderEmit);
    const origem=origemMun?(origemUF?`${origemMun}/${origemUF}`:origemMun):"";
    // Destino (tomador/destinatário)
    const destNode=doc.getElementsByTagNameNS(nsCte,"dest")[0];
    const destMunNode=doc.getElementsByTagNameNS(nsCte,"enderDest")[0];
    const destinoMun=g("xMun",destMunNode); const destinoUF=g("UF",destMunNode);
    const destino=destinoMun?(destinoUF?`${destinoMun}/${destinoUF}`:destinoMun):"";
    // Remetente (para vincular NF)
    const remNode=doc.getElementsByTagNameNS(nsCte,"rem")[0];
    const remetente=g("xNome",remNode)||"";
    // Valor total CTE
    const vTPrest=g("vTPrest"); const valor=vTPrest?fmtVal(vTPrest):"";
    // NFs vinculadas (infNFe ou infNF)
    const infNFeNodes=[...doc.getElementsByTagNameNS(nsCte,"infNFe")];
    const infNFNodes=[...doc.getElementsByTagNameNS(nsCte,"infNF")];
    const nfsVinculadas=[
      ...infNFeNodes.map(n=>n.getElementsByTagNameNS(nsCte,"chave")[0]?.textContent||g("chave",n)||"").filter(Boolean),
      ...infNFNodes.map(n=>g("nNF",n)).filter(Boolean),
    ];
    // Chave acesso CTE
    const infCTeNode=doc.getElementsByTagNameNS(nsCte,"infCte")[0]||doc.getElementsByTagNameNS(nsCte,"infCTe")[0];
    const chCTe=infCTeNode?.getAttribute("Id")?.replace(/^CTe/,"")||"";
    // Peso e volumes
    const qtCarga=g("qCarga"); const vCarga=g("vCarga")?fmtVal(g("vCarga")):"";
    return{numero,emissao,transportadora,emitCNPJ,origem,destino,valor,chCTe,remetente,nfsVinculadas,qtCarga,vCarga,cteOk:true};
  }catch(e){return null;}
}

                  <div key={label} style={{background:"#141414",borderRadius:7,padding:"8px 12px",border:"1px solid #1a2e1a"}}>
                    <div style={{fontSize:10,color:"#4ade80",fontWeight:700,marginBottom:3}}>{label}</div>
                    <div style={{fontSize:12,color:"#e2e8f0",wordBreak:"break-all"}}>{val}</div>
                  </div>
                ))}
              </div>
            </div>
            {freteModal.xmlCTe?.remetente&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",marginBottom:10,border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:3}}>📦 REMETENTE</div>
                <div style={{fontSize:13,color:"#e2e8f0"}}>{freteModal.xmlCTe.remetente}</div>
              </div>
            )}
            {freteModal.xmlCTe?.nfsVinculadas&&freteModal.xmlCTe.nfsVinculadas.length>0&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",marginBottom:10,border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:6}}>🔗 NOTAS FISCAIS DO CONHECIMENTO</div>
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {freteModal.xmlCTe.nfsVinculadas.map((ref,i)=>(
                    <div key={i} style={{background:"#141414",borderRadius:6,padding:"5px 10px",border:"1px solid #1e3a5f",fontFamily:"monospace",fontSize:11,color:"#93c5fd",wordBreak:"break-all"}}>{ref}</div>
                  ))}
                </div>
              </div>
            )}
            {freteModal.obs&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:3}}>📝 OBSERVAÇÕES</div>
                <div style={{fontSize:13,color:"#94a3b8"}}>{freteModal.obs}</div>
              </div>
            )}
          </div>
        </div>
      )}
      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}
      <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        {[["⏳","Pendentes","#fbbf24",pendentes.length],["✅","Finalizados","#34d399",finalizados.length],["📋","Total","#fff",nfs.length],["📎","Com XML","#a5b4fc",nfs.filter(n=>n.xmlData).length]].filter(([,lb,,ct])=>ct>0).map(([ic,lb,cl,ct])=>(
          <div key={lb} style={{background:"#141414",borderRadius:8,padding:"10px 18px",display:"flex",alignItems:"center",gap:8,border:"1px solid #2a2a2a"}}>
            <span>{ic}</span><span style={{fontSize:13,color:"#94a3b8"}}>{lb}</span><span style={{fontWeight:700,fontSize:20,color:cl}}>{ct}</span>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <button onClick={()=>{setShowPaste(!showPaste);setShowForm(false);}} style={{background:showPaste?"#990000":"#cc0000",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📋 Colar Lista</button>
        <button onClick={()=>xmlRef.current.click()} style={{background:"#1a0a0a",color:"#ff9999",border:"1px solid #cc0000",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📎 Importar XML(s)</button>
        <input ref={xmlRef} type="file" accept=".xml" multiple style={{display:"none"}} onChange={e=>{handleXMLFiles(e.target.files);e.target.value="";}}/>
        <button onClick={()=>{setShowForm(!showForm);setShowPaste(false);setEditId(null);setForm({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});}} style={{background:"#141414",color:"#e2e8f0",border:"1px solid #2a2a2a",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>+ Manual</button>
      </div>
      {showPaste&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #cc0000"}}>
          <h3 style={{margin:"0 0 6px",fontSize:15,color:"#ff9999"}}>📋 Colar Lista do Sistema</h3>
          <p style={{margin:"0 0 12px",fontSize:13,color:"#555"}}>Selecione tudo no Linx Microvix, copie (Ctrl+C) e cole abaixo:</p>
          <textarea value={pasteText} onChange={e=>handlePaste(e.target.value)} placeholder="Cole aqui..." rows={4} style={{...inp,resize:"vertical",fontFamily:"monospace",fontSize:12}}/>
          {pastePreview.length>0&&(()=>{
            const exist=new Set(nfs.map(n=>n.numero.trim()));
            const novas=pastePreview.filter(n=>!exist.has(n.numero.trim()));
            const dups=pastePreview.filter(n=>exist.has(n.numero.trim()));
            return <div style={{marginTop:14}}>
              <p style={{margin:"0 0 8px",fontSize:13,color:"#34d399",fontWeight:600}}>✅ {novas.length} nova(s) {dups.length>0&&<span style={{color:"#f87171"}}> · ⚠️ {dups.length} duplicata(s) serão ignoradas</span>}</p>
              <div style={{overflowX:"auto",maxHeight:200,overflowY:"auto",borderRadius:8,border:"1px solid #2a2a2a"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead><tr style={{background:"#0a0a0a"}}>{["","Número","Emissão","Emitente","Valor"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>)}</tr></thead>
                  <tbody>{pastePreview.map((n,i)=>{const isDup=exist.has(n.numero.trim());return <tr key={i} style={{borderBottom:"1px solid #1a1a1a",opacity:isDup?0.4:1}}><td style={{padding:"6px 10px"}}>{isDup?<span style={{color:"#f87171",fontSize:11}}>DUP</span>:<span style={{color:"#34d399",fontSize:11}}>NEW</span>}</td><td style={{padding:"6px 10px",color:"#ff9999",fontWeight:600}}>{n.numero}</td><td style={{padding:"6px 10px",color:"#94a3b8"}}>{n.emissao}</td><td style={{padding:"6px 10px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.emitente}</td><td style={{padding:"6px 10px",color:"#34d399"}}>{n.valor}</td></tr>;})}</tbody>
                </table>
              </div>
              {novas.length>0&&<button onClick={handleImport} style={{marginTop:12,background:"#059669",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Importar {novas.length} NF(s)</button>}
            </div>;
          })()}
          {pasteText&&pastePreview.length===0&&<p style={{color:"#f87171",fontSize:13,marginTop:10}}>⚠️ Não foi possível detectar NFs.</p>}
        </div>
      )}
      {showForm&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #2a2a2a"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,color:"#ff9999"}}>{editId?"✏️ Editar NF":"📥 Nova NF Manual"}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["numero","Número/Série *"],["emissao","Data de Emissão"],["emitente","Emitente *"],["valor","Valor (R$)"],["pedido","Nº Pedido"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>
        </div>
      )}
      <SubTabs active={sub} setActive={setSub} pendentes={pendentes.length} finalizados={finalizados.length} color="#cc0000"/>

      {highlightNF&&(
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#1a0d00",border:"1px solid #cc0000",borderRadius:8,padding:"8px 16px",margin:"10px 0",fontSize:13}}>
          <span style={{fontSize:18}}>🔍</span>
          <span style={{color:"#ff9999",fontWeight:700}}>Mostrando NF <span style={{color:"#fbbf24"}}>{highlightNF}</span> — vinda dos Pedidos</span>
          <button onClick={()=>{setSearch("");if(onHighlightDone)onHighlightDone();}} style={{marginLeft:"auto",background:"transparent",border:"1px solid #cc0000",borderRadius:6,color:"#cc0000",padding:"3px 10px",cursor:"pointer",fontSize:12}}>✕ Limpar</button>
        </div>
      )}

      <div style={{display:"flex",gap:10,margin:"14px 0",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar NF, emitente ou pedido..." style={{flex:1,minWidth:180,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
        <button onClick={()=>setSort(s=>s==="newest"?"oldest":"newest")} style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>{sort==="newest"?"📅 Mais recente":"📅 Mais antigo"}</button>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"📋":"✅"}</div>
          <p style={{marginTop:10,fontSize:14}}>
            {highlightNF?`NF ${highlightNF} não encontrada. Ela pode ainda não ter sido importada.`:sub==="pendentes"?"Nenhuma NF pendente.":"Nenhuma NF finalizada ainda."}
          </p>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Número/Série","Emissão","Dias","Emitente","Previsão Fornec.","Valor","Pedido","Frete Vinc.","Chegou em","Obs",""].map(h=>(
                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((nf,i)=>{
                const linkedFrete=getLinked(nf.numero);
                const key=supplierKey(nf.emitente);
                const st=stats[key];
                const dias=nf.chegou?diffDays(nf.emissao,nf.chegou):diasAberto(nf.emissao);
                const hasXml=!!nf.xmlData;
                const isHighlighted=highlightNF&&nf.numero.trim()===highlightNF.trim();
                return(
                  <tr
                    key={nf.id}
                    ref={el=>{ if(el) rowRefs.current[nf.numero]=el; }}
                    style={{borderBottom:"1px solid #1a1a1a",background:isHighlighted?"#2a1200":i%2===0?"#0a0a0a":"#111",transition:"background 0.3s"}}
                  >
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"nowrap"}}>
                        <button onClick={()=>setDanfeNf(nf)} style={{background:"transparent",border:"none",cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:4}}>
                          <span style={{color:hasXml?"#cc0000":"#666",fontWeight:700,fontSize:13,textDecoration:"underline",textUnderlineOffset:2}}>{nf.numero}</span>
                          {hasXml?<span style={{fontSize:10,background:"#1a0000",color:"#ff6666",border:"1px solid #cc0000",borderRadius:4,padding:"1px 5px"}}>XML</span>:<span style={{fontSize:10,color:"#444",border:"1px dashed #333",borderRadius:4,padding:"1px 5px"}}>sem XML</span>}
                        </button>
                        {navegarParaPedido&&<button onClick={()=>navegarParaPedido(nf.numero.trim())} title="Ver Pedido desta NF" style={{background:"#1c1200",border:"1px solid #f59e0b",borderRadius:5,padding:"3px 9px",color:"#fbbf24",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:3}}>📦 Pedido ↗</button>}
                      </div>
                    </td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{nf.emissao}</td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}>
                      {nf.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={nf.emitente}>{nf.emitente}</td>
                    <td style={{padding:"9px 12px"}}>{st?<MediaBadge media={st.media} count={st.count}/>:<span style={{color:"#333",fontSize:11}}>sem histórico</span>}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{nf.valor}</td>
                    <td style={{padding:"9px 12px"}}><input value={nf.pedido||""} onChange={e=>upd(nf.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {linkedFrete?<button onClick={()=>setFreteModal(linkedFrete)} title="Ver detalhes do frete" style={{background:"#0c2a3a",border:"1px solid #0891b2",borderRadius:6,padding:"3px 9px",color:"#38bdf8",fontWeight:700,fontSize:12,cursor:"pointer"}}>🚚 {linkedFrete.nf||linkedFrete.transportadora?.split(" ")[0]} 👁️</button>:<span style={{color:"#333",fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={nf.chegou} onSave={v=>handleChegou(nf.id,v)}/></td>
                    <td style={{padding:"9px 12px"}}><input value={nf.obs||""} onChange={e=>upd(nf.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...nf});setEditId(nf.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setNfs(prev=>prev.filter(n=>n.id!==nf.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

const FR_EMPTY={transportadora:"",nf:"",nfAssociada:"",pedido:"",origem:"",destino:"",previsao:"",valor:"",rastreio:"",obs:"",chegou:""};
function FretesTab({fretes,setFretes,nfs,setNfs,onChegouSync}){
  const[sub,setSub]=useState("pendentes");
  const[showForm,setShowForm]=useState(false);
  const[showPaste,setShowPaste]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(FR_EMPTY);
  const[search,setSearch]=useState("");
  const[toast,setToast]=useState(null);
  const[nfModal,setNfModal]=useState(null);
  const[cteModal,setCteModal]=useState(null);
  const xlsRef=useRef();
  const xmlCteRef=useRef();
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  const handleXMLCTeFiles=(files)=>{
    let ok=0,novos=0,enriquecidos=0;
    const promises=[...files].map(file=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const cte=parseCTe(e.target.result);
        if(!cte||!cte.cteOk){resolve();return;}
        // Tenta vincular NF automaticamente
        let nfAssociada="";
        if(cte.nfsVinculadas.length>0){
          for(const ref of cte.nfsVinculadas){
            const found=nfs.find(n=>(n.chNFe&&n.chNFe===ref)||(n.xmlData?.chNFe&&n.xmlData.chNFe===ref)||n.numero.trim()===ref.trim());
            if(found){nfAssociada=found.numero;break;}
          }
        }
        // Verifica se já existe frete com esse CT-e
        setFretes(prev=>{
          const idx=prev.findIndex(f=>(f.nf||"").trim()===cte.numero.trim());
          if(idx>=0){
            // ENRIQUECER frete existente com dados do XML
            const updated=[...prev];
            updated[idx]={
              ...updated[idx],
              emissao:cte.emissao||updated[idx].emissao,
              transportadora:cte.transportadora||updated[idx].transportadora,
              origem:cte.origem||updated[idx].origem,
              destino:cte.destino||updated[idx].destino,
              valor:cte.valor||updated[idx].valor,
              nfAssociada:nfAssociada||updated[idx].nfAssociada,
              xmlCTe:cte,
            };
            enriquecidos++;ok++;
            return updated;
          } else {
            // Frete novo
            const novoFrete={
              id:Date.now()+Math.random(),
              dataCadastro:today(),
              nf:cte.numero,
              emissao:cte.emissao,
              transportadora:cte.transportadora,
              origem:cte.origem,
              destino:cte.destino,
              valor:cte.valor,
              nfAssociada,
              pedido:"",rastreio:"",obs:"",chegou:"",previsao:"",
              xmlCTe:cte,
            };
            novos++;ok++;
            return [novoFrete,...prev];
          }
        });
        resolve();
      };
      reader.readAsText(file,"UTF-8");
    }));
    Promise.all(promises).then(()=>{
      if(ok>0){
        const parts=[];
        if(novos>0)parts.push(`${novos} novo(s)`);
        if(enriquecidos>0)parts.push(`${enriquecidos} enriquecido(s) com XML`);
        showToast(`✅ ${parts.join(" · ")}`);
      } else {
        showToast("⚠️ Nenhum CT-e válido encontrado.");
      }
    });
  };

  const handleXLSFiles=async(files)=>{
    let ok=0,dups=0;
    const exist=new Set(fretes.map(f=>f.nf.trim()));
    for(const file of files){
      try{
        const items=await parseXLS_Fretes(file);
        const novos=items.filter(f=>f.nf&&!exist.has(f.nf.trim()));
        const dupCount=items.filter(f=>f.nf&&exist.has(f.nf.trim())).length;
        ok+=novos.length;dups+=dupCount;
        if(novos.length>0){
          novos.forEach(f=>exist.add(f.nf.trim()));
          setFretes(prev=>[...novos.map(f=>({...f,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
        }
      }catch(err){showToast("❌ Erro ao ler XLS: "+err.message);}
    }
    if(ok>0)showToast(`✅ ${ok} frete(s) importado(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
    else showToast(dups>0?"⚠️ Todos já existem!":"⚠️ Nenhum frete encontrado no arquivo.");
  };

  const handleChegou=(frId,chegou)=>{
    setFretes(prev=>prev.map(f=>f.id===frId?{...f,chegou}:f));
    const fr=fretes.find(f=>f.id===frId);
    if(fr&&fr.nfAssociada){
      const nfBase=fr.nfAssociada.split("/")[0].trim();
      setNfs(prev=>prev.map(n=>{
        const nBase=n.numero.split("/")[0].trim();
        return nBase===nfBase?{...n,chegou}:n;
      }));
      if(onChegouSync)onChegouSync(nfBase,chegou);
    }
  };
  const handleNfAssociada=(frId,nfNum)=>{
    setFretes(prev=>prev.map(f=>{
      if(f.id!==frId)return f;
      const matchNf=nfs.find(n=>n.numero===nfNum);
      return{...f,nfAssociada:nfNum,chegou:matchNf?.chegou||f.chegou};
    }));
  };
  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseFretes(t):[]);};
  const handleImport=()=>{
    const exist=new Set(fretes.map(f=>f.nf.trim()));
    const novos=pastePreview.filter(f=>!exist.has(f.nf.trim()));
    const dups=pastePreview.length-novos.length;
    if(!novos.length){showToast("⚠️ Todos já existem!");return;}
    setFretes(prev=>[...novos.map(f=>({...f,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novos.length} importado(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.transportadora)return alert("Informe a transportadora.");
    if(editId)setFretes(prev=>prev.map(f=>f.id===editId?{...form,id:editId,dataCadastro:f.dataCadastro}:f));
    else setFretes(prev=>[{...form,id:Date.now(),dataCadastro:today()},...prev]);
    setEditId(null);setShowForm(false);setForm(FR_EMPTY);
    showToast("Frete salvo!");
  };
  const upd=(id,f,v)=>setFretes(prev=>prev.map(fr=>fr.id===id?{...fr,[f]:v}:fr));

  const pendentes=fretes.filter(f=>!f.chegou);
  const finalizados=fretes.filter(f=>!!f.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(f=>!search||f.transportadora.toLowerCase().includes(search.toLowerCase())||(f.nf||"").includes(search)||(f.pedido||"").includes(search)||(f.nfAssociada||"").includes(search));

  return(
    <div>
      {cteModal&&(

              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>

            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>

        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"🚚":"✅"}</div>

        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>

                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>

                  <tr key={fr.id} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"#0a0a0a":"#111"}}>

                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        {fr.xmlCTe?<button onClick={()=>setCteModal(fr)} title="Ver detalhes CT-e" style={{background:"#0a1a0a",border:"1px solid #16a34a",borderRadius:5,padding:"3px 7px",color:"#86efac",fontSize:11,cursor:"pointer",whiteSpace:"nowrap",fontWeight:700}}>📄 CT-e</button>:null}
                        <span>{fr.transportadora}</span>
                      </div>
                    </td>
                    <td style={{padding:"9px 12px",color:"#ff9999",whiteSpace:"nowrap"}}>{fr.nf||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{fr.emissao||"—"}</td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}>
                      {fr.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {(()=>{
                        const nfVinc=fr.nfAssociada?nfs.find(n=>n.numero.trim()===fr.nfAssociada.trim()):null;
                        return(
                          <div style={{display:"flex",alignItems:"center",gap:4}}>
                            <LinkBadge value={fr.nfAssociada} placeholder="+ vincular NF" color="#60a5fa" bg="#1e3a5f" borderColor="#3b82f6" icon="🔗" onChange={v=>handleNfAssociada(fr.id,v)} onClear={()=>upd(fr.id,"nfAssociada","")}/>
                            {nfVinc&&<button onClick={()=>setNfModal(nfVinc)} title="Ver detalhes da NF" style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:5,padding:"3px 7px",color:"#60a5fa",fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>👁️</button>}
                          </div>
                        );
                      })()}
                    </td>
                    <td style={{padding:"9px 12px"}}><input value={fr.pedido||""} onChange={e=>upd(fr.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",fontSize:12,whiteSpace:"nowrap"}}>{fr.origem&&fr.destino?`${fr.origem} → ${fr.destino}`:fr.origem||fr.destino||"—"}</td>

                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{fr.valor||"—"}</td>
                    <td style={{padding:"9px 12px"}}><input value={fr.rastreio||""} onChange={e=>upd(fr.id,"rastreio",e.target.value)} placeholder="Rastreio..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#c4b5fd",fontSize:12,width:100}}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.obs||""} onChange={e=>upd(fr.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={fr.chegou} onSave={v=>handleChegou(fr.id,v)}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {chegou?<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"4px 12px",color:"#4ade80",fontWeight:700,fontSize:12}}>📦 Chegou</span>:<span style={{background:"#1c1917",border:"1px solid #f59e0b",borderRadius:6,padding:"4px 12px",color:"#fbbf24",fontWeight:700,fontSize:12}}>⏳ Pendente</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...fr});setEditId(fr.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setFretes(prev=>prev.filter(f=>f.id!==fr.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function App(){
  const[tab,setTab]=useState("pedidos");
  const[nfs,setNfs]=useState([]);
  const[fretes,setFretes]=useState([]);
  const [chegouApply, setChegouApply] = useState(null);

  const onChegouSync=(nfBase,chegou)=>{
    setChegouApply({nfBase, chegou, ts: Date.now()});
  };
  const[dataLoaded,setDataLoaded]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[sheetsUrl,setSheetsUrl]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[urlDraft,setUrlDraft]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const[highlightNF,setHighlightNF]=useState(null);
  const[highlightPedido,setHighlightPedido]=useState(null);
  const nfsStatus = useAutoSave(STORAGE_NF, nfs);
  const fretesStatus = useAutoSave(STORAGE_FR, fretes);
  useAutoCloudSync(STORAGE_NF,sheetsUrl,setNfs);
  useAutoCloudSync(STORAGE_FR,sheetsUrl,setFretes);
  const isConnected=!!sheetsUrl;

  const navegarParaNF=(nfNumero)=>{
    setHighlightPedido(null);
    setHighlightNF(nfNumero);
    setTab("nf");
  };

      if(sheetsUrl){
        setSyncStatus("syncing");setSyncMsg("Sincronizando com a nuvem...");
        try{
          [cloudNfs,cloudFr]=await Promise.all([cloudLoad(STORAGE_NF),cloudLoad(STORAGE_FR)]);
          if(Array.isArray(cloudNfs)){
            setNfs(cloudNfs);
            try{localStorage.setItem(STORAGE_NF,JSON.stringify(cloudNfs));}catch{}
          }
          if(Array.isArray(cloudFr)){
            setFretes(cloudFr);
            try{localStorage.setItem(STORAGE_FR,JSON.stringify(cloudFr));}catch{}
          }
          setSyncStatus("ok");setSyncMsg("Sincronizado ✓");
        }catch{
          setSyncStatus("error");setSyncMsg("⚠️ Nuvem indisponível — usando dados locais");
        }
        setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
      }

      // Fallback somente quando a API não retornou um array.
      if(!Array.isArray(cloudNfs)){
        try{const s=localStorage.getItem(STORAGE_NF);if(s){const d=JSON.parse(s);if(Array.isArray(d))setNfs(d);}}catch{}
      }
      if(!Array.isArray(cloudFr)){
        try{const s=localStorage.getItem(STORAGE_FR);if(s){const d=JSON.parse(s);if(Array.isArray(d))setFretes(d);}}catch{}
      }
      setDataLoaded(true);
    }
    init();

  const importarBackup=(e)=>{

    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const backup=JSON.parse(ev.target.result);
        if(!backup.versao)throw new Error("Arquivo inválido");
        if(backup.nfs?.length>0){
          localStorage.setItem(STORAGE_NF,JSON.stringify(backup.nfs));
          setNfs(backup.nfs);
          if(sheetsUrl)cloudSave(STORAGE_NF,backup.nfs);
        }
        if(backup.fretes?.length>0){
          localStorage.setItem(STORAGE_FR,JSON.stringify(backup.fretes));
          setFretes(backup.fretes);
          if(sheetsUrl)cloudSave(STORAGE_FR,backup.fretes);
        }
        if(backup.pedidos?.length>0){
          localStorage.setItem(STORAGE_PED_V2,JSON.stringify(backup.pedidos));
          if(sheetsUrl)cloudSave(STORAGE_PED_V2,backup.pedidos);
        }
        if(backup.solicitacoes?.length>0){
          localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(backup.solicitacoes));
          if(sheetsUrl)cloudSave(STORAGE_SOL_V2,backup.solicitacoes);
        }
        if(backup.calendario&&Object.keys(backup.calendario).length>0){
          localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(backup.calendario));
          if(sheetsUrl)cloudSave(STORAGE_CAL_V1,backup.calendario);
        }

        alert(`✅ Backup restaurado com sucesso!\nData do backup: ${backup.data}\nNFs: ${backup.nfs?.length||0} | Fretes: ${backup.fretes?.length||0} | Pedidos: ${backup.pedidos?.length||0}\n\nRecarregando a página...`);

        alert("❌ Erro ao importar backup: "+err.message);

    };
    reader.readAsText(file);
    e.target.value="";
  };

  const testConnection=async()=>{
    setSyncStatus("syncing");setSyncMsg("Testando conexão...");

  const forceSync=async()=>{

      if(csol&&Array.isArray(csol)&&csol.length>0){localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(csol));count++;}
      if(ccal&&typeof ccal==="object"&&Object.keys(ccal).length>0){localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(ccal));count++;}
      setSyncStatus("ok");
      setSyncMsg(`✅ Sincronizado! ${count} conjunto(s) atualizado(s), sem recarregar a tela.`);
      setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},3500);
    }catch(err){
      setSyncStatus("error");setSyncMsg("❌ Erro: "+err.message);
      setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
    }
  };

    const tabs=[{id:"pedidos",label:"📦 Pedidos",color:"#f59e0b"},{id:"nf",label:"🧾 NF-e",color:"#cc0000"},{id:"fretes",label:"🚚 Fretes",color:"#ff4444"}];

  const syncDot={idle:{c:"#334155",t:"Sem nuvem"},syncing:{c:"#fbbf24",t:"Sincronizando..."},ok:{c:"#4ade80",t:"Nuvem OK"},error:{c:"#f87171",t:"Erro na nuvem"}};

                <li>Copie a URL gerada e cole abaixo</li>
              </ol>
            </div>
            <div style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:8,padding:14,marginBottom:20,fontFamily:"monospace",fontSize:11,color:"#67e8f9",maxHeight:160,overflowY:"auto",whiteSpace:"pre-wrap",userSelect:"all"}}>
{`function doGet(e){
  const key=e.parameter.key;
  if(!key||key==="test")return out("ok");
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName("MasterEPI");
  if(!sh)sh=ss.insertSheet("MasterEPI");
  const rows=sh.getDataRange().getValues();
  for(let r of rows){if(r[0]===key)return out(r[1]);}
  return out("null");
}
function doPost(e){
  try{
    const raw=e.postData?e.postData.contents:"{}";
    const b=JSON.parse(raw);
    if(!b.key)return out("error:no key");
    const val=JSON.stringify(b.value);
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    let sh=ss.getSheetByName("MasterEPI");
    if(!sh)sh=ss.insertSheet("MasterEPI");
    const data=sh.getDataRange().getValues();
    for(let i=0;i<data.length;i++){
      if(data[i][0]===b.key){
        sh.getRange(i+1,2).setValue(val);
        SpreadsheetApp.flush();
        return out("ok");
      }
    }
    sh.appendRow([b.key,val]);
    SpreadsheetApp.flush();
    return out("ok");
  }catch(err){return out("error:"+err.toString());}
}
function out(v){
  return ContentService.createTextOutput(v)
    .setMimeType(ContentService.MimeType.TEXT);
}`}

        </div>
      </div>
      <div style={{padding:"24px 28px"}}>
        {tab==="nf"&&<NfTab nfs={nfs} setNfs={setNfs} fretes={fretes} setFretes={setFretes} highlightNF={highlightNF} onHighlightDone={()=>setHighlightNF(null)} navegarParaPedido={navegarParaPedido} onChegouSync={onChegouSync}/>}

      </div>

  );
}

const DIAS_ORDER = ["seg","ter","qua","qui","sex","sab","dom"];

function getDiaAtual(){
  const d=new Date().getDay();
  return ["dom","seg","ter","qua","qui","sex","sab"][d];
}

function CalendarioCompras({grupos, sheetsUrl}){

  const[editando,setEditando]=useState(false);
  const[editDia,setEditDia]=useState(null);

  const diaAtual=getDiaAtual();
  const marcasHoje=cal[diaAtual]||[];
  useAutoCloudSync(STORAGE_CAL_V1,sheetsUrl,setCal);

  useEffect(()=>{
    async function init(){
      if(sheetsUrl){
        const c=await cloudLoad(STORAGE_CAL_V1);
        if(c){setCal(c);setLoaded(true);return;}
      }
      try{const s=localStorage.getItem(STORAGE_CAL_V1);if(s){setCal(JSON.parse(s));setLoaded(true);return;}}catch{}
      setLoaded(true);
    }
    init();
  },[sheetsUrl]);

  useEffect(()=>{
    if(!loaded)return;
    try{localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(cal));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_CAL_V1,cal);
  },[cal,loaded]);

  const addMarca=(dia)=>{
    const m=novaMarca.trim().toUpperCase();
    if(!m)return;
    setCal(prev=>({...prev,[dia]:[...(prev[dia]||[]),m]}));
    setNovaMarca("");
  };

  const removeMarca=(dia,idx)=>{
    setCal(prev=>({...prev,[dia]:(prev[dia]||[]).filter((_,i)=>i!==idx)}));
  };

  const hoje=new Date();
  const inicioSemana=new Date(hoje);
  inicioSemana.setDate(hoje.getDate()-hoje.getDay()+1);
  inicioSemana.setHours(0,0,0,0);

  const pedidosSemana=(marca)=>{
    const marcaUpper=marca.toUpperCase();
    return grupos.filter(g=>{
      if(!g.dataPedido)return false;
      const [dd,mm,yyyy]=g.dataPedido.split("/");
      const dt=new Date(`${yyyy}-${mm}-${dd}`);
      const fornUpper=(g.fornecedor||"").toUpperCase();
      return dt>=inicioSemana && (fornUpper.includes(marcaUpper)||marcaUpper.includes(fornUpper.split(" ")[0]));
    });
  };
  const todosPedidosMarca=(marca)=>{
    const marcaUpper=marca.toUpperCase();
    return grupos.filter(g=>{
      const fornUpper=(g.fornecedor||"").toUpperCase();
      return fornUpper.includes(marcaUpper)||marcaUpper.includes(fornUpper.split(" ")[0]);
    }).sort((a,b)=>{ const pa=a.dataPedido||"",pb=b.dataPedido||""; return pb.split("/").reverse().join("")-pa.split("/").reverse().join(""); });
  };

                      {g.numeroPedido&&<span style={{color:"#94a3b8",fontSize:11}}>Ped: {g.numeroPedido}</span>}
                      {g.nf&&<span style={{color:"#67e8f9",fontSize:11}}>NF: {g.nf}</span>}
                      {g.chegouDia&&<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:5,padding:"2px 7px",color:"#4ade80",fontSize:10}}>✓ Chegou {g.chegouDia}</span>}
                      {g.valor&&<span style={{color:"#34d399",fontSize:11,fontWeight:600}}>{g.valor}</span>}
                    </div>
                    {g.itens&&g.itens.length>0&&(
                      <div style={{width:"100%",marginTop:4,paddingLeft:97}}>
                        {g.itens.slice(0,3).map((it,j)=>(
                          <div key={j} style={{fontSize:10,color:"#64748b",marginBottom:2}}>
                            <span style={{color:"#fbbf24",fontWeight:600}}>{it.cod}</span> — {it.descricao.substring(0,60)}{it.descricao.length>60?"...":""}
                            {it.qtdSugerida&&<span style={{color:"#cc0000",marginLeft:8}}>qtd:{it.qtdSugerida}</span>}
                          </div>
                        ))}
                        {g.itens.length>3&&<div style={{fontSize:10,color:"#334155"}}>+{g.itens.length-3} itens</div>}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      <div style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:10,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid #2a2a2a"}}>
          <span style={{fontWeight:700,color:"#94a3b8",fontSize:13}}>📋 Calendário de Compras Semanal</span>
          <button onClick={()=>setEditando(!editando)} style={{background:editando?"#cc0000":"transparent",color:editando?"#fff":"#555",border:"1px solid #2a2a2a",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            {editando?"✓ Salvo":"✏️ Editar"}
          </button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:0}}>
          {DIAS_ORDER.filter(d=>d!=="sab"&&d!=="dom").map((dia)=>{
            const isHoje=dia===diaAtual;
            const cor=corDia(dia);
            const marcas=cal[dia]||[];
            return(
              <div key={dia} style={{borderRight:"1px solid #1a1a1a",padding:"10px 12px",background:isHoje?"#1a0a0a":"transparent",borderBottom:isHoje?`2px solid ${cor}`:"2px solid transparent"}}>
                <div style={{fontWeight:700,color:isHoje?cor:"#475569",fontSize:12,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{DIAS_LABEL[dia]}</div>
                {marcas.map((m,i)=>{
                  const peds=pedidosSemana(m);
                  return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                      <span onClick={()=>!editando&&setMarcaDetalhe({marca:m,dia})} style={{fontSize:11,color:peds.length>0?"#4ade80":isHoje?"#fff":"#64748b",fontWeight:peds.length>0||isHoje?600:400,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:editando?"default":"pointer",textDecoration:editando?"none":"underline",textUnderlineOffset:2}} title={editando?m:"Clique para ver pedidos de "+m}>
                        {peds.length>0?"✓ ":""}{m}
                      </span>
                      {editando&&<button onClick={()=>removeMarca(dia,i)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,padding:"0 2px",flexShrink:0,color:"#cc0000"}}>✕</button>}
                    </div>
                  );
                })}
                {editando&&(
                  <div style={{marginTop:6,display:"flex",gap:4}}>
                    {editDia===dia?(
                      <>
                        <input autoFocus value={novaMarca} onChange={e=>setNovaMarca(e.target.value)}
                          onKeyDown={e=>{if(e.key==="Enter")addMarca(dia);if(e.key==="Escape")setEditDia(null);}}
                          placeholder="Marca..." style={{background:"#0a0a0a",border:`1px solid ${cor}`,borderRadius:4,padding:"3px 6px",color:"#e2e8f0",fontSize:11,width:"100%"}}/>
                        <button onClick={()=>addMarca(dia)} style={{background:cor,color:"#fff",border:"none",borderRadius:4,padding:"3px 6px",cursor:"pointer",fontSize:11,flexShrink:0}}>+</button>
                      </>
                    ):(
                      <button onClick={()=>{setEditDia(dia);setNovaMarca("");}} style={{background:"transparent",border:`1px dashed #2a2a2a`,borderRadius:4,padding:"3px 8px",color:"#334155",cursor:"pointer",fontSize:10,width:"100%"}}>+ adicionar</button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PedidosTab({sheetsUrl, nfs, setNfs, fretes, setFretes, navegarParaNF, highlightPedido, onHighlightPedidoDone, onChegouApply}) {
  const [grupos, setGrupos] = useState([]);
  const loadedRef = useRef(false); // ← APENAS UMA DECLARAÇÃO (bug corrigido)
  const [syncPed, setSyncPed] = useState("idle");
  const [solicitacoes, setSolicitacoes] = useState([]);
  const solLoaded = useRef(false);
  const [sub, setSub] = useState("abertos");
  const [search, setSearch] = useState("");
  const [expandidos, setExpandidos] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalForn, setModalForn] = useState("");
  const [modalData, setModalData] = useState(today());
  const [modalLink, setModalLink] = useState("");
  const [modalNum, setModalNum] = useState("");
  const [modalTexto, setModalTexto] = useState("");
  const [modalPreview, setModalPreview] = useState([]);
  const [modalFile, setModalFile] = useState(null);
  const [uploadingCotacao, setUploadingCotacao] = useState(false);
  const [novaSol, setNovaSol] = useState({cod:"", descricao:"", data:""});
  const [toast, setToast] = useState(null);
  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(null),3500); };
  const pedStatus = useAutoSave(STORAGE_PED_V2, grupos);
  const solStatus = useAutoSave(STORAGE_SOL_V2, solicitacoes);
  useAutoCloudSync(STORAGE_PED_V2,sheetsUrl,setGrupos);
  useAutoCloudSync(STORAGE_SOL_V2,sheetsUrl,setSolicitacoes);
  const pedidoRefs=useRef({});

  useEffect(()=>{
    if(!onChegouApply)return;
    setGrupos(prev=>prev.map(g=>{
      const gBase=(g.nf||"").split("/")[0].trim();
      return gBase===onChegouApply.nfBase?{...g,chegouDia:onChegouApply.chegou}:g;
    }));
  },[onChegouApply]);

  const nfMatch=(nfA,nfB)=>{
    if(!nfA||!nfB)return false;
    const a=nfA.split("/")[0].trim();
    const b=nfB.split("/")[0].trim();
    return a===b;
  };

  useEffect(()=>{
    if(!highlightPedido)return;
    const g=grupos.find(x=>x.nf&&nfMatch(x.nf,highlightPedido));
    if(g){
      setSub(g.chegouDia?"finalizados":"abertos");
      setSearch(highlightPedido);
    } else {
      setSearch(highlightPedido);
    }
  },[highlightPedido,grupos]);

  useEffect(()=>{
    if(!highlightPedido)return;
    if(search!==highlightPedido)return;
    let r1,r2;
    r1=requestAnimationFrame(()=>{
      r2=requestAnimationFrame(()=>{
        const g=grupos.find(x=>x.nf&&nfMatch(x.nf,highlightPedido));
        if(g){
          const el=pedidoRefs.current[g._gid];
          if(el){
            el.scrollIntoView({behavior:"smooth",block:"center"});
            el.classList.remove("nf-highlight");
            void el.offsetWidth;
            el.classList.add("nf-highlight");
          }
          setExpandidos(prev=>({...prev,[g._gid]:true}));
        }
      });
    });
    return()=>{cancelAnimationFrame(r1);if(r2)cancelAnimationFrame(r2);};
  },[search,highlightPedido]);

  const catalogo = React.useMemo(()=>{
    const m={};
    PLANILHA_DATA.pedidos.forEach(p=>{if(p.cod&&p.descricao)m[String(p.cod)]=p.descricao;});
    return m;
  },[]);

  useEffect(()=>{
    loadedRef.current=false;
    async function init(){
      if(sheetsUrl){
        setSyncPed("syncing");
        const cloud=await cloudLoad(STORAGE_PED_V2);
        if(cloud&&cloud.length>0){loadedRef.current=true;setGrupos(cloud);setSyncPed("ok");setTimeout(()=>setSyncPed("idle"),2500);return;}
      }
      try{const s=localStorage.getItem(STORAGE_PED_V2);if(s){const d=JSON.parse(s);if(d&&d.length>0){loadedRef.current=true;setGrupos(d);return;}}}catch{}
      loadedRef.current=true;
      setSyncPed("idle");
    }
    async function initSol(){
      if(sheetsUrl){const c=await cloudLoad(STORAGE_SOL_V2);if(c){solLoaded.current=true;setSolicitacoes(c);return;}}
      try{const s=localStorage.getItem(STORAGE_SOL_V2);if(s){solLoaded.current=true;setSolicitacoes(JSON.parse(s));return;}}catch{}
      solLoaded.current=true;setSolicitacoes(PLANILHA_DATA.solicitacoes||[]);
    }
    init();initSol();
  },[sheetsUrl]);

  useEffect(()=>{
    if(!loadedRef.current)return;
    if(grupos.length===0)return;
    try{localStorage.setItem(STORAGE_PED_V2,JSON.stringify(grupos));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_PED_V2,grupos);
  },[grupos]);

  useEffect(()=>{
    if(!solLoaded.current)return;
    try{localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(solicitacoes));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_SOL_V2,solicitacoes);
  },[solicitacoes]);

  function parsarItens(raw){
    raw=raw.replace(/__ABRIR PDF__/gi,'').replace(/[🟢🔴🟠🟡⚫⚪🔵🟣✅❌⚠️]/g,'').trim();
    const items=[];
    for(const line of raw.split('\n').map(l=>l.trim()).filter(Boolean)){
      const cols=line.split('\t');
      if(cols.length>=2){const cod=cols[0]?.trim()||'',desc=cols[1]?.trim()||'',qtd=cols[2]?.trim()||'',sal=cols[3]?.trim()||'';if(cod&&desc)items.push({cod,descricao:desc,qtdSugerida:qtd,saldoEstoque:sal});continue;}
      const m=line.match(/^(\d{3,6})\s+(.+)/);
      if(m)items.push({cod:m[1],descricao:m[2].trim(),qtdSugerida:'',saldoEstoque:''});
    }
    return items;
  }

  const criarGrupo=async()=>{
    if(!modalForn.trim()){showToast("⚠️ Informe o fornecedor!");return;}
    setUploadingCotacao(true);
    try{
      let link=modalLink.trim();
      let arquivo=null;
      if(modalFile){
        if(!sheetsUrl){showToast("⚠️ Conecte a nuvem antes de anexar a cotação");return;}
        const uploaded=await cloudUpload(modalFile);
        link=uploaded.url;
        arquivo={id:uploaded.id,name:uploaded.name,mimeType:uploaded.mimeType,url:uploaded.url};
      }
      const novo={
        _gid:Date.now()+Math.random(),
        fornecedor:modalForn.trim(),
        dataPedido:modalData,
        numCotacao:modalNum.trim(),
        linkCotacao:link,
        cotacaoArquivo:arquivo,
        numeroPedido:"",
        dataAprovacao:"",
        faturouDia:"",
        nf:"",
        chegouDia:"",
        valor:"",
        itens:modalPreview
      };
      setGrupos(prev=>[novo,...prev]);
      setShowModal(false);setModalForn("");setModalData(today());setModalLink("");setModalNum("");setModalTexto("");setModalPreview([]);setModalFile(null);
      showToast(`✅ Cotação anexada — ${novo.fornecedor} está pendente de faturamento`);
    }catch(err){
      showToast("❌ Não foi possível anexar a cotação");
    }finally{setUploadingCotacao(false);}
  };
  const escolherCotacao=(file)=>{
    if(!file)return;
    if(!["application/pdf","image/png","image/jpeg","image/webp"].includes(file.type)){
      showToast("⚠️ Anexe PDF, JPG, PNG ou WEBP");return;
    }
    if(file.size>10*1024*1024){showToast("⚠️ O arquivo deve ter no máximo 10 MB");return;}
    setModalFile(file);
  };
  const colarCotacao=(e)=>{
    const item=[...(e.clipboardData?.items||[])].find(x=>x.kind==="file");
    if(item){const file=item.getAsFile();if(file){e.preventDefault();escolherCotacao(file);}}
  };

  const updG=(gid,field,value)=>{
    setGrupos(prev=>prev.map(g=>g._gid===gid?{...g,[field]:value}:g));
    if(field==="chegouDia"){
      const g=grupos.find(x=>x._gid===gid);
      if(g&&g.nf){
        const nfBase=g.nf.split("/")[0].trim();
        if(setNfs)setNfs(prev=>prev.map(n=>{
          const nBase=n.numero.split("/")[0].trim();
          return nBase===nfBase?{...n,chegou:value}:n;
        }));
        if(setFretes)setFretes(prev=>prev.map(fr=>{
          const fBase=(fr.nfAssociada||"").split("/")[0].trim();
          return fBase===nfBase?{...fr,chegou:value}:fr;
        }));
      }
    }
  };

  const getStatus=(g)=>{
    if(g.chegouDia)return{label:"✅ Recebido",color:"#4ade80",bg:"#052e16",border:"#16a34a"};
    const nfVinc=nfs&&g.nf?nfs.find(n=>n.numero.trim()===g.nf.trim()||(n.numero.split("/")[0].trim()===g.nf.split("/")[0].trim())):null;
    const frVinc=fretes&&g.nf?fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===g.nf.trim()):null;
    if(g.faturouDia&&g.nf)return{label:"📄 Faturado — aguardando chegar",color:"#67e8f9",bg:"#0c2a3a",border:"#0891b2"};
    if(frVinc)return{label:"🚚 Frete em trânsito",color:"#a78bfa",bg:"#1a0a2a",border:"#7c3aed"};
    if(nfVinc)return{label:"📄 NF-e vinculada",color:"#67e8f9",bg:"#0c2a3a",border:"#0891b2"};
    if(g.faturouDia&&!g.nf)return{label:"⚠️ Faturado — falta NF",color:"#f59e0b",bg:"#1c1200",border:"#ca8a04"};
    if(g.nf&&!g.faturouDia)return{label:"⚠️ NF informada — falta data",color:"#f59e0b",bg:"#1c1200",border:"#ca8a04"};
    if(g.numeroPedido)return{label:"⏳ Aguard. NF",color:"#f87171",bg:"#1a0000",border:"#cc0000"};
    if(g.dataAprovacao)return{label:"📤 Aguard. envio pedido",color:"#fb923c",bg:"#1c0a00",border:"#ea580c"};
    if(g.cotacaoArquivo||g.linkCotacao||g.numCotacao)return{label:"⏳ Pendente de faturamento",color:"#fbbf24",bg:"#1c1200",border:"#ca8a04"};
    return{label:"⏳ Novo",color:"#555",bg:"#111",border:"#222"};
  };

  const alertaChegada=(g)=>{
    if(g.chegouDia)return null;
    const fr=fretes&&g.nf?fretes.find(f=>f.nfAssociada&&String(f.nfAssociada).trim()===String(g.nf).trim()):null;
    const raw=g.previsaoChegada||fr?.previsao;
    if(!raw)return null;
    const m=String(raw).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    const dt=m?new Date(Number(m[3]),Number(m[2])-1,Number(m[1])):new Date(raw);
    if(isNaN(dt.getTime()))return null;
    const hoje=new Date();hoje.setHours(0,0,0,0);dt.setHours(0,0,0,0);
    const dias=Math.ceil((dt-hoje)/86400000);
    if(dias<0)return{label:`🚨 Chegada atrasada há ${Math.abs(dias)} dia(s)`,color:"#fca5a5",bg:"#450a0a",border:"#dc2626"};
    if(dias<=3)return{label:`⚠️ Chegada em ${dias} dia(s)`,color:"#fde68a",bg:"#451a03",border:"#f59e0b"};
    return null;
  };
  const dataInicioCotacao=(g)=>g.dataPedido||g.dataSolicitacao||g.dataCadastro||null;
  const tCot=(g)=>{const inicio=dataInicioCotacao(g);if(!inicio)return null;if(g.faturouDia)return diffDays(inicio,g.faturouDia);return diasAberto(inicio);};
  const tFat=(g)=>{const inicio=dataInicioCotacao(g);if(!inicio)return null;if(g.faturouDia)return diffDays(inicio,g.faturouDia);return diasAberto(inicio);};
  const tEnt=(g)=>{if(!g.faturouDia)return null;if(g.chegouDia)return diffDays(g.faturouDia,g.chegouDia);return diasAberto(g.faturouDia);};

  const abertos=grupos.filter(g=>(!g.faturouDia||!g.nf)&&!g.chegouDia);
  const aguardando=grupos.filter(g=>!!g.faturouDia&&!!g.nf&&!g.chegouDia);
  const finalizados=grupos.filter(g=>!!g.chegouDia);
  const temposFaturamento=grupos.filter(g=>dataInicioCotacao(g)&&g.faturouDia).map(g=>Math.max(0,diffDays(dataInicioCotacao(g),g.faturouDia)));
  const mediaFaturamento=temposFaturamento.length?Math.round((temposFaturamento.reduce((a,b)=>a+b,0)/temposFaturamento.length)*10)/10:null;
  const mediaPorFornecedor=(fornecedor)=>{
    const nome=String(fornecedor||"").trim().toLowerCase();
    const tempos=grupos.filter(g=>String(g.fornecedor||"").trim().toLowerCase()===nome&&dataInicioCotacao(g)&&g.faturouDia).map(g=>Math.max(0,diffDays(dataInicioCotacao(g),g.faturouDia)));
    return tempos.length?Math.round((tempos.reduce((a,b)=>a+b,0)/tempos.length)*10)/10:null;
  };
  const listaAtual=sub==="abertos"?abertos:(sub==="aguardando"?aguardando:finalizados);
  const filtrados=listaAtual.filter(g=>{
    if(!search)return true;
    const s=search.toLowerCase();
    const nfBase=(g.nf||"").split("/")[0].trim();
    const searchBase=search.split("/")[0].trim();
    return(
      g.fornecedor?.toLowerCase().includes(s)||
      (g.numeroPedido||"").includes(s)||
      (g.nf||"").includes(s)||
      nfBase===searchBase||
      (g.numCotacao||"").includes(s)
    );
  });

  const addSol=()=>{
    if(!novaSol.cod.trim())return;
    const desc=novaSol.descricao||catalogo[novaSol.cod.trim()]||"⚠️ CÓDIGO NÃO CADASTRADO";
    setSolicitacoes(prev=>[{...novaSol,descricao:desc,resposta:"",dataResposta:""},...prev]);
    setNovaSol({cod:"",descricao:"",data:""});
  };
  const updSol=(i,f,v)=>setSolicitacoes(prev=>prev.map((s,idx)=>idx===i?{...s,[f]:v}:s));

  const iSt={background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 7px",color:"#e2e8f0",fontSize:12};

  const CotacaoBadge=({g})=>{
    const[editLink,setEditLink]=useState(false);
    const[draftLink,setDraftLink]=useState(g.linkCotacao||"");
    const[editNum,setEditNum]=useState(false);
    const[draftNum,setDraftNum]=useState(g.numCotacao||"");

    if(!g.numCotacao&&!g.linkCotacao){
      return(
        <button onClick={()=>setEditNum(true)} style={{background:"transparent",border:"1px dashed #334155",borderRadius:6,padding:"3px 10px",color:"#475569",fontSize:12,cursor:"pointer"}}>
          + cotação
        </button>
      );
    }

    if(editNum){
      return(
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <input autoFocus value={draftNum} onChange={e=>setDraftNum(e.target.value)}
            placeholder="Nº cotação"
            onBlur={()=>{updG(g._gid,"numCotacao",draftNum);setEditNum(false);}}
            onKeyDown={e=>{if(e.key==="Enter"){updG(g._gid,"numCotacao",draftNum);setEditNum(false);}if(e.key==="Escape")setEditNum(false);}}
            style={{background:"#0a0a0a",border:"1px solid #4f46e5",borderRadius:5,padding:"3px 8px",color:"#a5b4fc",fontSize:12,width:90}}/>
        </div>
      );
    }

    if(editLink){
      return(
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <input autoFocus value={draftLink} onChange={e=>setDraftLink(e.target.value)}
            placeholder="https://drive.google.com/..."
            onBlur={()=>{updG(g._gid,"linkCotacao",draftLink);setEditLink(false);}}
            onKeyDown={e=>{if(e.key==="Enter"){updG(g._gid,"linkCotacao",draftLink);setEditLink(false);}if(e.key==="Escape")setEditLink(false);}}
            style={{background:"#0a0a0a",border:"1px solid #16a34a",borderRadius:5,padding:"3px 8px",color:"#4ade80",fontSize:12,width:200}}/>
        </div>
      );
    }

    return(
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>{setDraftNum(g.numCotacao||"");setEditNum(true);}}
          style={{background:"#1e1b4b",border:"1px solid #4f46e5",borderRadius:6,padding:"3px 10px",color:"#a5b4fc",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
          📋 {g.numCotacao||"—"}
        </button>
        {g.linkCotacao
          ?<a href={g.linkCotacao} target="_blank" rel="noreferrer"
              style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"3px 10px",color:"#4ade80",fontSize:12,fontWeight:700,textDecoration:"none",whiteSpace:"nowrap"}}>
              📄 PDF ↗
            </a>
          :<button onClick={()=>{setDraftLink("");setEditLink(true);}}
              style={{background:"transparent",border:"1px dashed #16a34a",borderRadius:6,padding:"3px 8px",color:"#4ade80",fontSize:11,cursor:"pointer"}}>
              + PDF
            </button>
        }
      </div>
    );
  };

  const NfField=({g})=>{
    const[ed,setEd]=useState(false);
    const[draft,setDraft]=useState(g.nf||"");
    const nfVinc=nfs&&g.nf?nfs.find(n=>n.numero.trim()===g.nf.trim()):null;
    const frVinc=fretes&&g.nf?fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===g.nf.trim()):null;

    const salvar=(v)=>{
      updG(g._gid,"nf",v);
      setEd(false);
    };

    if(ed){
      return(
        <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
          placeholder="Nº NF..."
          onBlur={()=>salvar(draft)}

            whiteSpace:"nowrap",

      <div style={{display:"flex",gap:2,borderBottom:"1px solid #2a2a2a",marginBottom:14}}>

      {sub!=="solicitacoes"&&(
        <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>

        </div>
      )}

      {highlightPedido&&sub!=="solicitacoes"&&(
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#1a1000",border:"1px solid #f59e0b",borderRadius:8,padding:"8px 16px",marginBottom:14,fontSize:13}}>

          <span style={{color:"#fbbf24",fontWeight:700}}>Mostrando pedido com NF <span style={{color:"#fff"}}>{highlightPedido}</span> — vindo da NF-e</span>

              <span style={{color:"#cc0000",fontWeight:700,fontSize:16}}>➕ Novo Pedido</span>

                    </div>
                    <span style={{color:"#2a2a2a",fontSize:18,flexShrink:0}}>→</span>
                    <div style={{display:"flex",flexDirection:"column",gap:2}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>NF-e</span>
                      <NfField g={g}/>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                      <span style={{fontSize:9,color:"#475569",textTransform:"uppercase"}}>Chegou</span>
                      <ChegouInput value={g.chegouDia} onSave={v=>updG(g._gid,"chegouDia",v)}/>
                    </div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginLeft:"auto"}}>
                      {tc!==null&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}><span style={{fontSize:9,color:"#475569"}}>⏱Aguard. faturamento</span><DiasBadge dias={tc}/></div>}
                    </div>
                    <span style={{background:st.bg,border:`1px solid ${st.border}`,borderRadius:6,padding:"4px 10px",color:st.color,fontWeight:700,fontSize:11,whiteSpace:"nowrap",flexShrink:0}}>{st.label}</span>
                    {alerta&&<span style={{background:alerta.bg,border:`1px solid ${alerta.border}`,borderRadius:6,padding:"4px 10px",color:alerta.color,fontWeight:700,fontSize:11,whiteSpace:"nowrap",flexShrink:0}}>{alerta.label}</span>}
                    <button onClick={()=>{if(confirm(`Remover pedido ${g.fornecedor}?`))setGrupos(prev=>prev.filter(x=>x._gid!==g._gid));}}

                  </div>

                  {exp&&(
                    <div style={{borderTop:"1px solid #1a1a1a",padding:"14px 16px",background:"#0d0d0d"}}>

                          <input value={g.linkCotacao||""} onChange={e=>updG(g._gid,"linkCotacao",e.target.value)}
                            placeholder="https://drive.google.com/file/d/..."
                            style={{width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"6px 10px",color:"#4ade80",fontSize:12,boxSizing:"border-box"}}/>

                        <div>
                          <label style={{fontSize:10,color:"#475569",display:"block",marginBottom:3}}>Nº Cotação</label>
                          <input value={g.numCotacao||""} onChange={e=>updG(g._gid,"numCotacao",e.target.value)}
                            style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"6px 10px",color:"#a5b4fc",fontSize:12,width:100}}/>

                        <div>
                          <label style={{fontSize:10,color:"#475569",display:"block",marginBottom:3}}>Valor Total</label>
                          <input value={g.valor||""} onChange={e=>updG(g._gid,"valor",e.target.value)} placeholder="R$ ..."

                            <div style={{fontSize:12,color:"#e2e8f0"}}>NF: <b>{g.nf}</b>{nfRelacionada&&<> · Fornecedor: {nfRelacionada.emitente||"—"} · Emissão: {nfRelacionada.emissao||"—"} · Valor: {nfRelacionada.valor||"—"}</>}</div>

                          </div>
                        );
                      })()}
                      {(()=>{
                        const editandoItens=expandidos[g._gid+"_itens"];
                        const toggleEditItens=()=>setExpandidos(p=>({...p,[g._gid+"_itens"]:!p[g._gid+"_itens"]}));
                        const updItem=(i,field,val)=>setGrupos(prev=>prev.map(gr=>gr._gid===g._gid?{...gr,itens:gr.itens.map((it,idx)=>idx===i?{...it,[field]:val}:it)}:gr));
                        const removeItem=(i)=>setGrupos(prev=>prev.map(gr=>gr._gid===g._gid?{...gr,itens:gr.itens.filter((_,idx)=>idx!==i)}:gr));
                        const addItem=()=>setGrupos(prev=>prev.map(gr=>gr._gid===g._gid?{...gr,itens:[...(gr.itens||[]),{cod:"",descricao:"",qtdSugerida:"",saldoEstoque:"",vlrUnit:""}]}:gr));
                        const itens=g.itens||[];
                        const iStyle={background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:4,padding:"3px 6px",fontSize:11,outline:"none",width:"100%",boxSizing:"border-box"};

                          <div>
                            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                              <span style={{color:"#475569",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>

                              </span>
                              <div style={{display:"flex",gap:6}}>
                                {editandoItens&&<button onClick={addItem} style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"4px 12px",color:"#4ade80",fontSize:11,fontWeight:700,cursor:"pointer"}}>+ Adicionar linha</button>}
                                <button onClick={toggleEditItens} style={{background:editandoItens?"#cc0000":"#1a1a1a",border:`1px solid ${editandoItens?"#cc0000":"#334155"}`,borderRadius:6,padding:"4px 12px",color:editandoItens?"#fff":"#94a3b8",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                                  {editandoItens?"✓ Salvo":"✏️ Editar itens"}
                                </button>
                              </div>
                            </div>

                            {itens.length===0&&!editandoItens?(
                              <div style={{textAlign:"center",padding:"16px 0",color:"#334155",fontSize:12}}>
                                Nenhum item. <button onClick={toggleEditItens} style={{background:"transparent",border:"none",color:"#cc0000",cursor:"pointer",fontSize:12,textDecoration:"underline"}}>Adicionar itens</button>
                              </div>
                            ):(
                              <div style={{overflowX:"auto"}}>
                                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                                  <thead>
                                    <tr style={{background:"#141414",borderBottom:"1px solid #2a2a2a"}}>

                                        <th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
                                      ))}
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {itens.map((it,i)=>(
                                      <tr key={i} style={{borderBottom:"1px solid #1a1a1a",background:i%2===0?"transparent":"rgba(255,255,255,0.02)"}}>
