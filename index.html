const {useState,useEffect,useRef}=React;

// ===== AUTO-SAVE INDICATOR =====
function AutoSaveIndicator({ status }) {
  if (status === "idle") return null;
  const colors = { saving: "#fbbf24", saved: "#4ade80", error: "#f87171" };
  const texts = { saving: "💾 Salvando...", saved: "✅ Salvo", error: "❌ Erro" };
  return (
    <div style={{
      position: "fixed", bottom: "20px", right: "20px", padding: "8px 12px",
      borderRadius: "6px", fontSize: "12px", fontWeight: "600", zIndex: 9999,
      background: colors[status], color: "#000", boxShadow: "0 2px 10px rgba(0,0,0,0.3)"
    }}>
      {texts[status]}
    </div>
  );
}

function useAutoSave(key, value, debounceMs = 800) {
  const debounceTimerRef = useRef(null);
  const [status, setStatus] = useState("idle");
  useEffect(() => {
    if (!value || (Array.isArray(value) && value.length === 0)) return;
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    setStatus("saving");
    debounceTimerRef.current = setTimeout(async () => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        const url = localStorage.getItem(STORAGE_SHEETS_URL) || DEFAULT_SHEETS_URL;
        if (url && typeof cloudSave === 'function') {
          const ok = await cloudSave(key, value);
          setStatus(ok ? "saved" : "error");
        } else {
          setStatus("saved");
        }
        setTimeout(() => setStatus("idle"), 2000);
      } catch (err) {
        setStatus("error");
        setTimeout(() => setStatus("idle"), 3000);
      }
    }, debounceMs);
    return () => { if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current); };
  }, [key, value]);
  return status;
}

const STORAGE_FR="fretes_v3";
const STORAGE_SHEETS_URL="sheets_url_v1";

const DEFAULT_SHEETS_URL="https://script.google.com/macros/s/AKfycbzqg_7D_g6ndSs3xQ5Yn36m0b_uoAD1RlCgOzJJwGfLdOu8RU7lePVQQD9U1wFB96Xr/exec";

async function cloudSave(key, value){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return false;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),10000);
    const body=new URLSearchParams({key:key,value:JSON.stringify(value)});
    const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString(),signal:ctrl.signal});
    clearTimeout(tid);
    if(!response.ok){console.error("HTTP erro:",response.status);return false;}
    const text=await response.text();
    return text==="ok"||text.includes("ok");
  }catch{return false;}
}
async function cloudLoad(key){
  const url=localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL;
  if(!url)return null;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),12000);
    const r=await fetch(`${url}?key=${encodeURIComponent(key)}&ts=${Date.now()}`,{signal:ctrl.signal});
    clearTimeout(tid);
    const text=await r.text();
    if(!text||text==="null"||text.trim()==="")return null;
    return JSON.parse(text);
  }catch{return null;}
}

function today(){return new Date().toLocaleDateString("pt-BR");}
function parseDate(str){if(!str)return 0;const[d,m,y]=str.split("/");return new Date(`${y}-${m}-${d}`).getTime()||0;}
function diffDays(a,b){const da=parseDate(a),db=parseDate(b);if(!da||!db)return null;return Math.round((db-da)/86400000);}
function diasAberto(emissao){if(!emissao)return null;const h=new Date();h.setHours(0,0,0,0);const e=parseDate(emissao);return e?Math.floor((h-e)/86400000):null;}
function supplierKey(e){return e?(e.replace(/\(CNPJ:.*?\)/gi,"").trim().toUpperCase().substring(0,40)):"";}
function buildStats(nfs){
  const map={};
  for(const n of nfs){if(!n.emissao||!n.chegou)continue;const d=diffDays(n.emissao,n.chegou);if(d===null||d<0)continue;const k=supplierKey(n.emitente);if(!map[k])map[k]=[];map[k].push(d);}
  const s={};
  for(const[k,a]of Object.entries(map))s[k]={media:Math.round(a.reduce((x,y)=>x+y,0)/a.length),count:a.length};
  return s;
}
function fmtVal(v){if(!v)return"";const n=parseFloat(String(v).replace(/[^0-9,.-]/g,"").replace(",","."));return isNaN(n)?v:"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}

function parseXML(xmlText){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xmlText,"text/xml");
    const ns="http://www.portalfiscal.inf.br/nfe";
    const g=(tag,ctx)=>(ctx||doc).getElementsByTagNameNS(ns,tag)[0]?.textContent||"";
    const nNF=g("nNF"); const serie=g("serie");
    const numero=serie?`${nNF}/${serie}`:nNF;
    const emitNode=doc.getElementsByTagNameNS(ns,"emit")[0];
    const destNode=doc.getElementsByTagNameNS(ns,"dest")[0];
    const transpNode=doc.getElementsByTagNameNS(ns,"transporta")[0];
    const emitente=g("xNome",emitNode)||"";
    const emitCNPJ=emitNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const emitEnder=emitNode?.getElementsByTagNameNS(ns,"enderEmit")[0];
    const emitCidade=g("xMun",emitEnder)+(g("UF",emitEnder)?" / "+g("UF",emitEnder):"");
    const destNome=g("xNome",destNode)||"";
    const destEnder=destNode?.getElementsByTagNameNS(ns,"enderDest")[0];
    const destCidade=g("xMun",destEnder)+(g("UF",destEnder)?" / "+g("UF",destEnder):"");
    const vNF=g("vNF"); const valor=vNF?fmtVal(vNF):"";
    const chNFe=g("chNFe");
    const dhEmi=g("dhEmi");
    const emissao=dhEmi?(()=>{const d=new Date(dhEmi);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;})():"";
    const natureza=g("natOp")||"";
    const transportadora=g("xNome",transpNode)||"";
    const transCNPJ=transpNode?.getElementsByTagNameNS(ns,"CNPJ")[0]?.textContent||"";
    const modFrete=(()=>{const m=g("modFrete");return{0:"0-Emitente",1:"1-Dest/Rem",2:"2-Terceiros",3:"3-Próprio",4:"4-Próprio(Dest)",9:"9-Sem frete"}[m]||m;})();
    const volNode=doc.getElementsByTagNameNS(ns,"vol")[0];
    const qVol=g("qVol",volNode)||""; const pesoB=g("pesoB",volNode)||""; const pesoL=g("pesoL",volNode)||"";
    const nVol=g("nVol",volNode)||"";
    const dups=[...doc.getElementsByTagNameNS(ns,"dup")].map(d=>({nDup:g("nDup",d),dVenc:g("dVenc",d),vDup:fmtVal(g("vDup",d))}));
    const itens=[...doc.getElementsByTagNameNS(ns,"det")].map(det=>{
      const prod=det.getElementsByTagNameNS(ns,"prod")[0];
      return{
        item:det.getAttribute("nItem")||"",
        codigo:g("cProd",prod),
        descricao:g("xProd",prod),
        ncm:g("NCM",prod),
        cfop:g("CFOP",prod),
        unid:g("uCom",prod),
        qtd:g("qCom",prod),
        vUnit:fmtVal(g("vUnCom",prod)),
        vProd:fmtVal(g("vProd",prod)),
        pedido:g("xPed",prod)||"",
      };
    });
    const tot=doc.getElementsByTagNameNS(ns,"ICMSTot")[0];
    const totais={vProd:fmtVal(g("vProd",tot)),vFrete:fmtVal(g("vFrete",tot)),vDesc:fmtVal(g("vDesc",tot)),vIPI:fmtVal(g("vIPI",tot)),vPIS:fmtVal(g("vPIS",tot)),vCOFINS:fmtVal(g("vCOFINS",tot)),vNF:fmtVal(g("vNF",tot))};
    const infCpl=g("infCpl")||"";
    return{numero,emissao,emitente,emitCNPJ,emitCidade,destNome,destCidade,valor,chNFe,natureza,transportadora,transCNPJ,modFrete,qVol,pesoB,pesoL,nVol,dups,itens,totais,infCpl,xmlOk:true};
  }catch(e){return null;}
}

function parseCTe(xmlText){
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(xmlText,"text/xml");
    const nsCte="http://www.portalfiscal.inf.br/cte";
    const g=(tag,ctx)=>{
      const el=(ctx||doc).getElementsByTagNameNS(nsCte,tag)[0];
      return el?.textContent||"";
    };
    // Número/série
    const nCT=g("nCT"); const serie=g("serie");
    const numero=serie?`${nCT}/${serie}`:nCT;
    // Emissão
    const dhEmi=g("dhEmi")||g("dEmi");
    const emissao=dhEmi?(()=>{const d=new Date(dhEmi);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;})():"";
    // Emitente (transportadora)
    const emitNode=doc.getElementsByTagNameNS(nsCte,"emit")[0];
    const transportadora=g("xNome",emitNode)||"";
    const emitCNPJ=emitNode?.getElementsByTagNameNS(nsCte,"CNPJ")[0]?.textContent||"";
    const enderEmit=emitNode?.getElementsByTagNameNS(nsCte,"enderEmit")[0];
    const origemMun=g("xMun",enderEmit); const origemUF=g("UF",enderEmit);
    const origem=origemMun?(origemUF?`${origemMun}/${origemUF}`:origemMun):"";
    // Destino (tomador/destinatário)
    const destNode=doc.getElementsByTagNameNS(nsCte,"dest")[0];
    const destMunNode=doc.getElementsByTagNameNS(nsCte,"enderDest")[0];
    const destinoMun=g("xMun",destMunNode); const destinoUF=g("UF",destMunNode);
    const destino=destinoMun?(destinoUF?`${destinoMun}/${destinoUF}`:destinoMun):"";
    // Remetente (para vincular NF)
    const remNode=doc.getElementsByTagNameNS(nsCte,"rem")[0];
    const remetente=g("xNome",remNode)||"";
    // Valor total CTE
    const vTPrest=g("vTPrest"); const valor=vTPrest?fmtVal(vTPrest):"";
    // NFs vinculadas (infNFe ou infNF)
    const infNFeNodes=[...doc.getElementsByTagNameNS(nsCte,"infNFe")];
    const infNFNodes=[...doc.getElementsByTagNameNS(nsCte,"infNF")];
    const nfsVinculadas=[
      ...infNFeNodes.map(n=>n.getElementsByTagNameNS(nsCte,"chave")[0]?.textContent||g("chave",n)||"").filter(Boolean),
      ...infNFNodes.map(n=>g("nNF",n)).filter(Boolean),
    ];
    // Chave acesso CTE
    const infCTeNode=doc.getElementsByTagNameNS(nsCte,"infCte")[0]||doc.getElementsByTagNameNS(nsCte,"infCTe")[0];
    const chCTe=infCTeNode?.getAttribute("Id")?.replace(/^CTe/,"")||"";
    // Peso e volumes
    const qtCarga=g("qCarga"); const vCarga=g("vCarga")?fmtVal(g("vCarga")):"";
    return{numero,emissao,transportadora,emitCNPJ,origem,destino,valor,chCTe,remetente,nfsVinculadas,qtCarga,vCarga,cteOk:true};
  }catch(e){return null;}
}

function parseNFs(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);const r=[];
  for(const line of lines){
    if(/^(número|emissão|emitente)/i.test(line))continue;
    const p=line.split(/\t/);
    if(p.length>=5){r.push({numero:p[0]?.trim()||"",emissao:p[1]?.trim()||"",emitente:p[2]?.trim()||"",natureza:p[3]?.trim()||"",valor:p[4]?.trim()||"",pedido:"",obs:"",chegou:""});continue;}
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const num=line.substring(0,di).trim();const after=line.substring(di+dm[0].length).trim();
    const cm=after.match(/^(.*?\(CNPJ:\s*[\d.\/-]+\))/i);
    let emit="",valor=vm?vm[0]:"";
    if(cm){emit=cm[1].trim();}else if(vm){const vi=after.indexOf(vm[0]);emit=after.substring(0,vi).trim();}
    if(num)r.push({numero:num,emissao:dm[0],emitente:emit,natureza:"",valor,pedido:"",obs:"",chegou:""});
  }
  return r;
}
function parseFretes(text){
  const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);
  const r=[];
  const BLANK={pedido:"",rastreio:"",obs:"",chegou:"",origem:"",destino:"",previsao:"",nfAssociada:""};
  const NATS_CAPS=["SAIDA PARA FORA DO ESTADO ESTABELECIMENTO COMERCIAL","TRANSPORTE RODOVIARIO","TRANSP A EST COMERCIAL","TRANSPORTE DE CARGAS","PRESTACAO DE SERVICO DE TRANSPORTE"];
  for(const line of lines){
    if(/^(número|emissão|transportadora)/i.test(line))continue;
    // Formato tabulado (exportação XLS/cópia tabela)
    const p=line.split(/\t/);
    if(p.length>=4){r.push({nf:p[0]?.trim()||"",emissao:p[1]?.trim()||"",transportadora:p[2]?.trim()||"",valor:fmtVal(p[3]?.trim()||"")||p[3]?.trim()||"",...BLANK});continue;}
    // Formato colado do sistema: numero/serie(grudado)dd/mm/aaaa(grudado)TRANSPORTADORA(grudado)natureza(grudado)R$ valor(grudado)status
    const m=line.match(/^(\d+\/\d{1,3})(\d{2}\/\d{2}\/\d{4})(.*?)(R\$\s*[\d.,]+)/i);
    if(m){
      const[,nf,emissao,middle,valor]=m;
      // Separar transportadora (CAPS) da natureza
      const transMatch=middle.match(/^([A-ZÁÉÍÓÚÀÃÂÊÔÇÑ\s\d.\/\-&]+?)(?=[A-Z][a-záéíóúàãâêôç]|$)/);
      let trans=transMatch?transMatch[1].trim():middle.trim();
      // Verificar se natureza em CAPS está colada no fim da transportadora
      for(const k of NATS_CAPS){if(trans.toUpperCase().endsWith(k)){trans=trans.slice(0,trans.toUpperCase().lastIndexOf(k)).trim();break;}}
      if(nf||trans)r.push({nf,emissao,transportadora:trans,valor:fmtVal(valor)||valor,...BLANK});
      continue;
    }
    // Fallback: buscar data em qualquer posição
    const dm=line.match(/(\d{2}\/\d{2}\/\d{4})/);const vm=line.match(/(R\$\s*[\d.,]+)/i);if(!dm)continue;
    const di=line.indexOf(dm[0]);const nf=line.substring(0,di).trim();const after=line.substring(di+dm[0].length);
    let trans="",valor=vm?vm[0]:"";
    if(vm){const vi=after.indexOf(vm[0]);trans=after.substring(0,vi).trim();}
    if(nf||trans)r.push({nf,emissao:dm[0],transportadora:trans,valor,...BLANK});
  }
  return r;
}

function parseXLS_Fretes(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(!rows||rows.length<2){resolve([]);return;}
        // Detect header row
        let headerIdx=0;
        for(let i=0;i<Math.min(5,rows.length);i++){
          const row=rows[i].map(c=>String(c).toLowerCase());
          if(row.some(c=>c.includes("cte")||c.includes("ct-e")||c.includes("conhecimento")||c.includes("número")||c.includes("numero")||c.includes("nf"))){
            headerIdx=i;break;
          }
        }
        const headers=rows[headerIdx].map(h=>String(h||"").toLowerCase().trim());
        const col=(names)=>{for(const n of names){const i=headers.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
        const iNf    = col(["cte","ct-e","conhecimento","número","numero","nf"]);
        const iEmiss = col(["emissão","emissao","data emis","dt emis","data"]);
        const iTrans = col(["transportadora","transp","trans","empresa","razão","razao","nome"]);
        const iValor = col(["valor","vlr","vl "]);
        const iOrig  = col(["origem","orig"]);
        const iDest  = col(["destino","dest"]);
        const iPrev  = col(["previsão","previsao","prev","entrega"]);
        const iPed   = col(["pedido","ped"]);
        const iRastr = col(["rastreio","rastreamento","track"]);
        const result=[];
        for(let i=headerIdx+1;i<rows.length;i++){
          const r=rows[i];
          if(!r||r.every(c=>!c))continue;
          const get=(idx)=>idx>=0?String(r[idx]||"").trim():"";
          const fmtDate=(v)=>{
            if(!v)return"";
            if(v instanceof Date){const d=v;return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;}
            const s=String(v).trim();
            if(/\d{2}\/\d{2}\/\d{4}/.test(s))return s;
            // Excel serial
            if(/^\d+$/.test(s)){const d=new Date(Math.round((parseInt(s)-25569)*86400*1000));return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;}
            return s;
          };
          const nf=get(iNf);
          const trans=get(iTrans);
          if(!nf&&!trans)continue;
          const rawVal=iValor>=0?r[iValor]||"":"";
          const valor=rawVal?fmtVal(String(rawVal)):"";
          result.push({
            nf,
            emissao:fmtDate(iEmiss>=0?r[iEmiss]||"":""),
            transportadora:trans,
            valor,
            origem:get(iOrig),
            destino:get(iDest),
            previsao:fmtDate(iPrev>=0?r[iPrev]||"":""),
            pedido:get(iPed),
            rastreio:get(iRastr),
            obs:"",chegou:"",nfAssociada:""
          });
        }
        resolve(result);
      }catch(err){reject(err);}
    };
    reader.onerror=reject;
    reader.readAsArrayBuffer(file);
  });
}

function ChegouInput({value,onSave}){
  const[draft,setDraft]=useState(value||"");
  useEffect(()=>{setDraft(value||"");},[value]);
  const handleChange=e=>{let v=e.target.value;setDraft(v);if(v.length===10){onSave(v);}if(v.length===0&&value){onSave("");}};
  const handleBlur=()=>{if(draft.length===10){onSave(draft);}else if(draft.length===0&&value){onSave("");}else{setDraft(value||"");}};
  const handleKeyDown=e=>{if(e.key==="Enter"&&draft.length===10){onSave(draft);}if(e.key==="Escape"){setDraft(value||"");}};
  return <input value={draft} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} placeholder="dd/mm/aaaa" style={{background:"transparent",border:`1px solid ${draft.length>0&&draft.length<10?"#cc0000":"#2a2a2a"}`,borderRadius:6,padding:"4px 8px",color:"#4ade80",fontSize:12,width:95,textAlign:"center"}}/>;
}

function NfTab({nfs,setNfs,fretes,setFretes,highlightNF,onHighlightDone,navegarParaPedido,onChegouSync}){
  const[sub,setSub]=useState("pendentes");
  const[showPaste,setShowPaste]=useState(false);
  const[showForm,setShowForm]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[search,setSearch]=useState("");
  const[sort,setSort]=useState("newest");
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});
  const[toast,setToast]=useState(null);
  const[danfeNf,setDanfeNf]=useState(null);
  const[freteModal,setFreteModal]=useState(null);
  const xmlRef=useRef();
  const rowRefs=useRef({});
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  useEffect(()=>{
    if(!highlightNF)return;
    const nf=nfs.find(n=>n.numero.trim()===highlightNF.trim());
    setSub(nf?.chegou?"finalizados":"pendentes");
    setSearch(highlightNF);
  },[highlightNF]);

  useEffect(()=>{
    if(!highlightNF)return;
    if(search!==highlightNF)return;
    let raf1,raf2;
    raf1=requestAnimationFrame(()=>{
      raf2=requestAnimationFrame(()=>{
        const el=rowRefs.current[highlightNF];
        if(el){
          el.scrollIntoView({behavior:"smooth",block:"center"});
          el.classList.remove("nf-highlight");
          void el.offsetWidth;
          el.classList.add("nf-highlight");
        }
      });
    });
    return()=>{cancelAnimationFrame(raf1);if(raf2)cancelAnimationFrame(raf2);};
  },[search, highlightNF]);

  const handleChegou=(nfId,chegou)=>{
    setNfs(prev=>prev.map(n=>n.id===nfId?{...n,chegou}:n));
    const nf=nfs.find(n=>n.id===nfId);
    if(nf){
      const nfBase=nf.numero.split("/")[0].trim();
      setFretes(prev=>prev.map(fr=>fr.nfAssociada===nf.numero?{...fr,chegou}:fr));
      if(onChegouSync)onChegouSync(nfBase,chegou);
    }
  };

  const handleXMLFiles=(files)=>{
    let ok=0,notFound=0;
    const promises=[...files].map(file=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const xmlData=parseXML(e.target.result);
        if(!xmlData){resolve();return;}
        setNfs(prev=>{
          const idx=prev.findIndex(n=>n.numero.trim()===xmlData.numero.trim());
          if(idx===-1){notFound++;resolve();return prev;}
          ok++;
          const updated=[...prev];
          updated[idx]={...updated[idx],xmlData,
            emitente:xmlData.emitente||updated[idx].emitente,
            valor:xmlData.valor||updated[idx].valor,
            natureza:xmlData.natureza||updated[idx].natureza,
            pedido:xmlData.itens?.[0]?.pedido||updated[idx].pedido,
          };
          resolve();
          return updated;
        });
      };
      reader.readAsText(file);
    }));
    Promise.all(promises).then(()=>{
      setTimeout(()=>showToast(`✅ ${ok} XML(s) associado(s)${notFound>0?" · "+notFound+" não encontrado(s)":""}`),200);
    });
  };

  const stats=buildStats(nfs);
  const pendentes=nfs.filter(n=>!n.chegou);
  const finalizados=nfs.filter(n=>!!n.chegou);
  const base=sub==="pendentes"?pendentes:finalizados;
  const filtered=base.filter(n=>!search||n.numero.includes(search)||n.emitente.toLowerCase().includes(search.toLowerCase())||(n.pedido||"").includes(search))
    .sort((a,b)=>{const da=parseDate(a.emissao)||parseDate(a.dataCadastro);const db=parseDate(b.emissao)||parseDate(b.dataCadastro);return sort==="oldest"?da-db:db-da;});
  const getLinked=(num)=>fretes.find(f=>f.nfAssociada&&f.nfAssociada.trim()===num.trim());

  const handlePaste=(t)=>{setPasteText(t);setPastePreview(t.trim()?parseNFs(t):[]);};
  const handleImport=()=>{
    const exist=new Set(nfs.map(n=>n.numero.trim()));
    const novas=pastePreview.filter(n=>!exist.has(n.numero.trim()));
    const dups=pastePreview.length-novas.length;
    if(!novas.length){showToast("⚠️ Todas já existem!");return;}
    setNfs(prev=>[...novas.map(n=>({...n,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
    setPasteText("");setPastePreview([]);setShowPaste(false);
    showToast(`✅ ${novas.length} importada(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);
  };
  const handleSave=()=>{
    if(!form.numero||!form.emitente)return alert("Preencha Número e Emitente.");
    if(editId)setNfs(prev=>prev.map(n=>n.id===editId?{...form,id:editId,dataCadastro:n.dataCadastro}:n));
    else setNfs(prev=>[{...form,id:Date.now(),dataCadastro:today()},...prev]);
    setEditId(null);setShowForm(false);setForm({numero:"",emissao:"",emitente:"",natureza:"",valor:"",pedido:"",obs:"",chegou:""});
    showToast("NF salva!");
  };
  const upd=(id,f,v)=>setNfs(prev=>prev.map(n=>n.id===id?{...n,[f]:v}:n));

  return(
    <div>
      {danfeNf&&<DanfeModal nf={danfeNf} onClose={()=>setDanfeNf(null)}/>}
      {freteModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px 10px"}} onClick={()=>setFreteModal(null)}>
          <div style={{background:"#141414",border:"1px solid #16a34a",borderRadius:12,padding:28,maxWidth:680,width:"100%",boxShadow:"0 8px 40px rgba(22,163,74,0.2)",maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:20}}>🚚</span>
                <span style={{color:"#86efac",fontWeight:900,fontSize:16}}>Frete — {freteModal.transportadora}</span>
                {freteModal.xmlCTe&&<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"2px 8px",color:"#4ade80",fontWeight:700,fontSize:11}}>CT-e</span>}
              </div>
              <button onClick={()=>setFreteModal(null)} style={{background:"transparent",border:"1px solid #334155",borderRadius:6,color:"#94a3b8",padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕ Fechar</button>
            </div>
            <div style={{background:"#0d1f12",borderRadius:10,padding:"14px 16px",marginBottom:14,border:"1px solid #166534"}}>
              <div style={{color:"#86efac",fontWeight:700,fontSize:12,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>📋 Informações do Frete</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12}}>
                {[
                  ["Transportadora", freteModal.transportadora],
                  ["CT-e / Nº", freteModal.nf],
                  ["📅 Emissão", freteModal.emissao||freteModal.xmlCTe?.emissao||"—"],
                  ["Valor do Frete", freteModal.valor],
                  ["Origem", freteModal.xmlCTe?.origem||freteModal.origem],
                  ["Destino", freteModal.xmlCTe?.destino||freteModal.destino],
                  ["Previsão", freteModal.previsao],
                  ["Pedido", freteModal.pedido],
                  ["Rastreio", freteModal.rastreio],
                  ["Chegou em", freteModal.chegou],
                ].filter(([,v])=>v).map(([label,val])=>(
                  <div key={label} style={{background:"#141414",borderRadius:7,padding:"8px 12px",border:"1px solid #1a2e1a"}}>
                    <div style={{fontSize:10,color:"#4ade80",fontWeight:700,marginBottom:3}}>{label}</div>
                    <div style={{fontSize:12,color:"#e2e8f0",wordBreak:"break-all"}}>{val}</div>
                  </div>
                ))}
              </div>
            </div>
            {freteModal.xmlCTe?.remetente&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",marginBottom:10,border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:3}}>📦 REMETENTE</div>
                <div style={{fontSize:13,color:"#e2e8f0"}}>{freteModal.xmlCTe.remetente}</div>
              </div>
            )}
            {freteModal.xmlCTe?.nfsVinculadas&&freteModal.xmlCTe.nfsVinculadas.length>0&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",marginBottom:10,border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:6}}>🔗 NOTAS FISCAIS DO CONHECIMENTO</div>
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {freteModal.xmlCTe.nfsVinculadas.map((ref,i)=>(
                    <div key={i} style={{background:"#141414",borderRadius:6,padding:"5px 10px",border:"1px solid #1e3a5f",fontFamily:"monospace",fontSize:11,color:"#93c5fd",wordBreak:"break-all"}}>{ref}</div>
                  ))}
                </div>
              </div>
            )}
            {freteModal.obs&&(
              <div style={{background:"#0a0a0a",borderRadius:8,padding:"10px 14px",border:"1px solid #1e293b"}}>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,marginBottom:3}}>📝 OBSERVAÇÕES</div>
                <div style={{fontSize:13,color:"#94a3b8"}}>{freteModal.obs}</div>

          </div>
        </div>

      {toast&&<div style={{position:"fixed",top:20,right:20,background:"#065f46",color:"#fff",padding:"12px 20px",borderRadius:10,fontWeight:600,fontSize:14,zIndex:998,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>{toast}</div>}

      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <button onClick={()=>{setShowPaste(!showPaste);setShowForm(false);}} style={{background:showPaste?"#990000":"#cc0000",color:"#fff",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📋 Colar Lista</button>
        <button onClick={()=>xmlRef.current.click()} style={{background:"#1a0a0a",color:"#ff9999",border:"1px solid #cc0000",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>📎 Importar XML(s)</button>

              <p style={{margin:"0 0 8px",fontSize:13,color:"#34d399",fontWeight:600}}>✅ {novas.length} nova(s) {dups.length>0&&<span style={{color:"#f87171"}}> · ⚠️ {dups.length} duplicata(s) serão ignoradas</span>}</p>
              <div style={{overflowX:"auto",maxHeight:200,overflowY:"auto",borderRadius:8,border:"1px solid #2a2a2a"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead><tr style={{background:"#0a0a0a"}}>{["","Número","Emissão","Emitente","Valor"].map(h=><th key={h} style={{padding:"6px 10px",textAlign:"left",color:"#555",fontWeight:600}}>{h}</th>)}</tr></thead>
                  <tbody>{pastePreview.map((n,i)=>{const isDup=exist.has(n.numero.trim());return <tr key={i} style={{borderBottom:"1px solid #1a1a1a",opacity:isDup?0.4:1}}><td style={{padding:"6px 10px"}}>{isDup?<span style={{color:"#f87171",fontSize:11}}>DUP</span>:<span style={{color:"#34d399",fontSize:11}}>NEW</span>}</td><td style={{padding:"6px 10px",color:"#ff9999",fontWeight:600}}>{n.numero}</td><td style={{padding:"6px 10px",color:"#94a3b8"}}>{n.emissao}</td><td style={{padding:"6px 10px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.emitente}</td><td style={{padding:"6px 10px",color:"#34d399"}}>{n.valor}</td></tr>;})}</tbody>

              {novas.length>0&&<button onClick={handleImport} style={{marginTop:12,background:"#059669",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Importar {novas.length} NF(s)</button>}
            </div>;
          })()}

      {showForm&&(
        <div style={{background:"#141414",borderRadius:12,padding:20,marginBottom:20,border:"1px solid #2a2a2a"}}>
          <h3 style={{margin:"0 0 14px",fontSize:15,color:"#ff9999"}}>{editId?"✏️ Editar NF":"📥 Nova NF Manual"}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {[["numero","Número/Série *"],["emissao","Data de Emissão"],["emitente","Emitente *"],["valor","Valor (R$)"],["pedido","Nº Pedido"],["chegou","Data de Chegada"]].map(([k,l])=>(
              <div key={k}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>{l}</label><input value={form[k]||""} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))} style={inp}/></div>
            ))}
            <div style={{gridColumn:"1/-1"}}><label style={{fontSize:12,color:"#94a3b8",display:"block",marginBottom:4}}>Observações</label><input value={form.obs||""} onChange={e=>setForm(p=>({...p,obs:e.target.value}))} style={inp}/></div>
          </div>
          <button onClick={handleSave} style={{marginTop:14,background:"#cc0000",color:"#fff",border:"none",padding:"9px 22px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>{editId?"💾 Salvar":"✅ Registrar"}</button>
        </div>
      )}
      <SubTabs active={sub} setActive={setSub} pendentes={pendentes.length} finalizados={finalizados.length} color="#cc0000"/>

      {highlightNF&&(
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#1a0d00",border:"1px solid #cc0000",borderRadius:8,padding:"8px 16px",margin:"10px 0",fontSize:13}}>
          <span style={{fontSize:18}}>🔍</span>
          <span style={{color:"#ff9999",fontWeight:700}}>Mostrando NF <span style={{color:"#fbbf24"}}>{highlightNF}</span> — vinda dos Pedidos</span>
          <button onClick={()=>{setSearch("");if(onHighlightDone)onHighlightDone();}} style={{marginLeft:"auto",background:"transparent",border:"1px solid #cc0000",borderRadius:6,color:"#cc0000",padding:"3px 10px",cursor:"pointer",fontSize:12}}>✕ Limpar</button>
        </div>
      )}

      <div style={{display:"flex",gap:10,margin:"14px 0",flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar NF, emitente ou pedido..." style={{flex:1,minWidth:180,background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13}}/>
        <button onClick={()=>setSort(s=>s==="newest"?"oldest":"newest")} style={{background:"#141414",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 14px",color:"#e2e8f0",fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>{sort==="newest"?"📅 Mais recente":"📅 Mais antigo"}</button>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"50px 20px",color:"#475569"}}>
          <div style={{fontSize:44}}>{sub==="pendentes"?"📋":"✅"}</div>
          <p style={{marginTop:10,fontSize:14}}>
            {highlightNF?`NF ${highlightNF} não encontrada. Ela pode ainda não ter sido importada.`:sub==="pendentes"?"Nenhuma NF pendente.":"Nenhuma NF finalizada ainda."}
          </p>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{background:"#141414",borderBottom:"2px solid #cc0000"}}>
                {["Número/Série","Emissão","Dias","Emitente","Previsão Fornec.","Valor","Pedido","Frete Vinc.","Chegou em","Obs",""].map(h=>(
                  <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((nf,i)=>{
                const linkedFrete=getLinked(nf.numero);
                const key=supplierKey(nf.emitente);
                const st=stats[key];
                const dias=nf.chegou?diffDays(nf.emissao,nf.chegou):diasAberto(nf.emissao);
                const hasXml=!!nf.xmlData;
                const isHighlighted=highlightNF&&nf.numero.trim()===highlightNF.trim();
                return(
                  <tr
                    key={nf.id}
                    ref={el=>{ if(el) rowRefs.current[nf.numero]=el; }}
                    style={{borderBottom:"1px solid #1a1a1a",background:isHighlighted?"#2a1200":i%2===0?"#0a0a0a":"#111",transition:"background 0.3s"}}
                  >
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"nowrap"}}>
                        <button onClick={()=>setDanfeNf(nf)} style={{background:"transparent",border:"none",cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:4}}>
                          <span style={{color:hasXml?"#cc0000":"#666",fontWeight:700,fontSize:13,textDecoration:"underline",textUnderlineOffset:2}}>{nf.numero}</span>
                          {hasXml?<span style={{fontSize:10,background:"#1a0000",color:"#ff6666",border:"1px solid #cc0000",borderRadius:4,padding:"1px 5px"}}>XML</span>:<span style={{fontSize:10,color:"#444",border:"1px dashed #333",borderRadius:4,padding:"1px 5px"}}>sem XML</span>}
                        </button>
                        {navegarParaPedido&&<button onClick={()=>navegarParaPedido(nf.numero.trim())} title="Ver Pedido desta NF" style={{background:"#1c1200",border:"1px solid #f59e0b",borderRadius:5,padding:"3px 9px",color:"#fbbf24",fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:3}}>📦 Pedido ↗</button>}
                      </div>
                    </td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{nf.emissao}</td>
                    <td style={{padding:"9px 12px",textAlign:"center"}}>
                      {nf.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={nf.emitente}>{nf.emitente}</td>
                    <td style={{padding:"9px 12px"}}>{st?<MediaBadge media={st.media} count={st.count}/>:<span style={{color:"#333",fontSize:11}}>sem histórico</span>}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{nf.valor}</td>
                    <td style={{padding:"9px 12px"}}><input value={nf.pedido||""} onChange={e=>upd(nf.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {linkedFrete?<button onClick={()=>setFreteModal(linkedFrete)} title="Ver detalhes do frete" style={{background:"#0c2a3a",border:"1px solid #0891b2",borderRadius:6,padding:"3px 9px",color:"#38bdf8",fontWeight:700,fontSize:12,cursor:"pointer"}}>🚚 {linkedFrete.nf||linkedFrete.transportadora?.split(" ")[0]} 👁️</button>:<span style={{color:"#333",fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={nf.chegou} onSave={v=>handleChegou(nf.id,v)}/></td>
                    <td style={{padding:"9px 12px"}}><input value={nf.obs||""} onChange={e=>upd(nf.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>

                      <button onClick={()=>{setForm({...nf});setEditId(nf.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setNfs(prev=>prev.filter(n=>n.id!==nf.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>

}

const FR_EMPTY={transportadora:"",nf:"",nfAssociada:"",pedido:"",origem:"",destino:"",previsao:"",valor:"",rastreio:"",obs:"",chegou:""};
function FretesTab({fretes,setFretes,nfs,setNfs,onChegouSync}){
  const[sub,setSub]=useState("pendentes");
  const[showForm,setShowForm]=useState(false);
  const[showPaste,setShowPaste]=useState(false);
  const[pasteText,setPasteText]=useState("");
  const[pastePreview,setPastePreview]=useState([]);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(FR_EMPTY);
  const[search,setSearch]=useState("");
  const[toast,setToast]=useState(null);
  const[nfModal,setNfModal]=useState(null);
  const[cteModal,setCteModal]=useState(null);
  const xlsRef=useRef();
  const xmlCteRef=useRef();
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500);};
  const inp={width:"100%",background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:6,padding:"8px 10px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"};

  const handleXMLCTeFiles=(files)=>{
    let ok=0,novos=0,enriquecidos=0;
    const promises=[...files].map(file=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const cte=parseCTe(e.target.result);
        if(!cte||!cte.cteOk){resolve();return;}
        // Tenta vincular NF automaticamente
        let nfAssociada="";
        if(cte.nfsVinculadas.length>0){
          for(const ref of cte.nfsVinculadas){
            const found=nfs.find(n=>(n.chNFe&&n.chNFe===ref)||(n.xmlData?.chNFe&&n.xmlData.chNFe===ref)||n.numero.trim()===ref.trim());
            if(found){nfAssociada=found.numero;break;}
          }
        }
        // Verifica se já existe frete com esse CT-e
        setFretes(prev=>{
          const idx=prev.findIndex(f=>(f.nf||"").trim()===cte.numero.trim());
          if(idx>=0){
            // ENRIQUECER frete existente com dados do XML
            const updated=[...prev];
            updated[idx]={
              ...updated[idx],
              emissao:cte.emissao||updated[idx].emissao,
              transportadora:cte.transportadora||updated[idx].transportadora,
              origem:cte.origem||updated[idx].origem,
              destino:cte.destino||updated[idx].destino,
              valor:cte.valor||updated[idx].valor,
              nfAssociada:nfAssociada||updated[idx].nfAssociada,
              xmlCTe:cte,
            };
            enriquecidos++;ok++;
            return updated;
          } else {
            // Frete novo
            const novoFrete={
              id:Date.now()+Math.random(),
              dataCadastro:today(),
              nf:cte.numero,
              emissao:cte.emissao,
              transportadora:cte.transportadora,
              origem:cte.origem,
              destino:cte.destino,
              valor:cte.valor,
              nfAssociada,
              pedido:"",rastreio:"",obs:"",chegou:"",previsao:"",
              xmlCTe:cte,
            };
            novos++;ok++;
            return [novoFrete,...prev];
          }
        });
        resolve();
      };
      reader.readAsText(file,"UTF-8");
    }));
    Promise.all(promises).then(()=>{
      if(ok>0){
        const parts=[];
        if(novos>0)parts.push(`${novos} novo(s)`);
        if(enriquecidos>0)parts.push(`${enriquecidos} enriquecido(s) com XML`);

    let ok=0,dups=0;

        ok+=novos.length;dups+=dupCount;

          setFretes(prev=>[...novos.map(f=>({...f,id:Date.now()+Math.random(),dataCadastro:today()})),...prev]);
        }
      }catch(err){showToast("❌ Erro ao ler XLS: "+err.message);}

    if(ok>0)showToast(`✅ ${ok} frete(s) importado(s)${dups>0?" · "+dups+" duplicata(s) ignorada(s)":""}`);

                      {fr.chegou?<span style={{background:"#0f2922",border:"1px solid #10b981",borderRadius:6,padding:"3px 9px",color:"#34d399",fontWeight:700,fontSize:12}}>{dias}d ✓</span>:<DiasBadge dias={dias}/>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {(()=>{
                        const nfVinc=fr.nfAssociada?nfs.find(n=>n.numero.trim()===fr.nfAssociada.trim()):null;
                        return(
                          <div style={{display:"flex",alignItems:"center",gap:4}}>
                            <LinkBadge value={fr.nfAssociada} placeholder="+ vincular NF" color="#60a5fa" bg="#1e3a5f" borderColor="#3b82f6" icon="🔗" onChange={v=>handleNfAssociada(fr.id,v)} onClear={()=>upd(fr.id,"nfAssociada","")}/>
                            {nfVinc&&<button onClick={()=>setNfModal(nfVinc)} title="Ver detalhes da NF" style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:5,padding:"3px 7px",color:"#60a5fa",fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>👁️</button>}
                          </div>
                        );
                      })()}
                    </td>
                    <td style={{padding:"9px 12px"}}><input value={fr.pedido||""} onChange={e=>upd(fr.id,"pedido",e.target.value)} placeholder="Pedido..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#fbbf24",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",fontSize:12,whiteSpace:"nowrap"}}>{fr.origem&&fr.destino?`${fr.origem} → ${fr.destino}`:fr.origem||fr.destino||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#94a3b8",whiteSpace:"nowrap"}}>{fr.previsao||"—"}</td>
                    <td style={{padding:"9px 12px",color:"#34d399",fontWeight:600,whiteSpace:"nowrap"}}>{fr.valor||"—"}</td>
                    <td style={{padding:"9px 12px"}}><input value={fr.rastreio||""} onChange={e=>upd(fr.id,"rastreio",e.target.value)} placeholder="Rastreio..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#c4b5fd",fontSize:12,width:100}}/></td>
                    <td style={{padding:"9px 12px"}}><input value={fr.obs||""} onChange={e=>upd(fr.id,"obs",e.target.value)} placeholder="Obs..." style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:5,padding:"4px 8px",color:"#94a3b8",fontSize:12,width:85}}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}><ChegouInput value={fr.chegou} onSave={v=>handleChegou(fr.id,v)}/></td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      {chegou?<span style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:6,padding:"4px 12px",color:"#4ade80",fontWeight:700,fontSize:12}}>📦 Chegou</span>:<span style={{background:"#1c1917",border:"1px solid #f59e0b",borderRadius:6,padding:"4px 12px",color:"#fbbf24",fontWeight:700,fontSize:12}}>⏳ Pendente</span>}
                    </td>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap"}}>
                      <button onClick={()=>{setForm({...fr});setEditId(fr.id);setShowForm(true);setShowPaste(false);}} style={{background:"transparent",border:"1px solid #2a2a2a",color:"#94a3b8",padding:"4px 8px",borderRadius:6,cursor:"pointer",marginRight:4,fontSize:12}}>✏️</button>
                      <button onClick={()=>{if(confirm("Remover?"))setFretes(prev=>prev.filter(f=>f.id!==fr.id));}} style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:12}}>🗑️</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function App(){
  const[tab,setTab]=useState("pedidos");
  const[nfs,setNfs]=useState([]);
  const[fretes,setFretes]=useState([]);
  const [chegouApply, setChegouApply] = useState(null);

  const onChegouSync=(nfBase,chegou)=>{
    setChegouApply({nfBase, chegou, ts: Date.now()});
  };
  const[dataLoaded,setDataLoaded]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[sheetsUrl,setSheetsUrl]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[urlDraft,setUrlDraft]=useState(()=>localStorage.getItem(STORAGE_SHEETS_URL)||DEFAULT_SHEETS_URL);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const[highlightNF,setHighlightNF]=useState(null);
  const[highlightPedido,setHighlightPedido]=useState(null);
  const nfsStatus = useAutoSave(STORAGE_NF, nfs);
  const fretesStatus = useAutoSave(STORAGE_FR, fretes);
  const isConnected=!!sheetsUrl;

  const navegarParaNF=(nfNumero)=>{
    setHighlightPedido(null);
    setHighlightNF(nfNumero);
    setTab("nf");
  };

  const navegarParaPedido=(nfNumero)=>{
    const numBase=nfNumero.split("/")[0].trim();
    setHighlightNF(null);
    setHighlightPedido(numBase);
    setTab("pedidos");
  };

  useEffect(()=>{
    setDataLoaded(false);
    async function init(){
      let localNfs=[], localFr=[];
      try{const s=localStorage.getItem(STORAGE_NF);if(s){const d=JSON.parse(s);if(Array.isArray(d)&&d.length>0)localNfs=d;}}catch{}
      try{const s=localStorage.getItem(STORAGE_FR);if(s){const d=JSON.parse(s);if(Array.isArray(d)&&d.length>0)localFr=d;}}catch{}

      if(localNfs.length>0)setNfs(localNfs);
      if(localFr.length>0)setFretes(localFr);

      if(sheetsUrl){
        setSyncStatus("syncing");setSyncMsg("Sincronizando com a nuvem...");
        try{
          const [cnf,cfr]=await Promise.all([cloudLoad(STORAGE_NF),cloudLoad(STORAGE_FR)]);
          if(cnf&&Array.isArray(cnf)&&cnf.length>0){
            if(cnf.length>=localNfs.length){
              setNfs(cnf);
              try{localStorage.setItem(STORAGE_NF,JSON.stringify(cnf));}catch{}
            }
          }
          if(cfr&&Array.isArray(cfr)&&cfr.length>0){
            if(cfr.length>=localFr.length){
              setFretes(cfr);
              try{localStorage.setItem(STORAGE_FR,JSON.stringify(cfr));}catch{}
            }
          }
          setSyncStatus("ok");setSyncMsg("Sincronizado ✓");
        }catch{
          setSyncStatus("error");setSyncMsg("⚠️ Nuvem indisponível — usando dados locais");
        }
        setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
      }
      setDataLoaded(true);
    }
    init();
  },[sheetsUrl]);

  useEffect(()=>{
    if(!dataLoaded)return;
    if(nfs.length===0)return;
    try{localStorage.setItem(STORAGE_NF,JSON.stringify(nfs));}catch{}
    if(sheetsUrl){cloudSave(STORAGE_NF,nfs);}
  },[nfs,dataLoaded]);

  useEffect(()=>{
    if(!dataLoaded)return;
    if(fretes.length===0)return;
    try{localStorage.setItem(STORAGE_FR,JSON.stringify(fretes));}catch{}
    if(sheetsUrl){cloudSave(STORAGE_FR,fretes);}
  },[fretes,dataLoaded]);

  const saveUrl=()=>{
    const url=urlDraft.trim();
    localStorage.setItem(STORAGE_SHEETS_URL,url);
    setSheetsUrl(url);
    setShowSettings(false);
  };

  const exportarBackup=()=>{
    const backup={
      versao:"masterepi_v1",
      data: new Date().toLocaleString("pt-BR"),
      nfs: JSON.parse(localStorage.getItem(STORAGE_NF)||"[]"),
      fretes: JSON.parse(localStorage.getItem(STORAGE_FR)||"[]"),
      pedidos: JSON.parse(localStorage.getItem(STORAGE_PED_V2)||"[]"),
      solicitacoes: JSON.parse(localStorage.getItem(STORAGE_SOL_V2)||"[]"),
      calendario: JSON.parse(localStorage.getItem(STORAGE_CAL_V1)||"{}"),
    };
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`masterepi_backup_${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.json`;
    a.click();
  };

  const importarBackup=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const backup=JSON.parse(ev.target.result);
        if(!backup.versao)throw new Error("Arquivo inválido");
        if(backup.nfs?.length>0){
          localStorage.setItem(STORAGE_NF,JSON.stringify(backup.nfs));
          setNfs(backup.nfs);
          if(sheetsUrl)cloudSave(STORAGE_NF,backup.nfs);
        }
        if(backup.fretes?.length>0){
          localStorage.setItem(STORAGE_FR,JSON.stringify(backup.fretes));
          setFretes(backup.fretes);
          if(sheetsUrl)cloudSave(STORAGE_FR,backup.fretes);
        }
        if(backup.pedidos?.length>0){
          localStorage.setItem(STORAGE_PED_V2,JSON.stringify(backup.pedidos));
          if(sheetsUrl)cloudSave(STORAGE_PED_V2,backup.pedidos);
        }
        if(backup.solicitacoes?.length>0){
          localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(backup.solicitacoes));
          if(sheetsUrl)cloudSave(STORAGE_SOL_V2,backup.solicitacoes);
        }
        if(backup.calendario&&Object.keys(backup.calendario).length>0){
          localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(backup.calendario));
          if(sheetsUrl)cloudSave(STORAGE_CAL_V1,backup.calendario);
        }
        sessionStorage.setItem("backup_just_restored","1");
        alert(`✅ Backup restaurado com sucesso!\nData do backup: ${backup.data}\nNFs: ${backup.nfs?.length||0} | Fretes: ${backup.fretes?.length||0} | Pedidos: ${backup.pedidos?.length||0}\n\nRecarregando a página...`);
        setTimeout(()=>window.location.reload(),800);
      }catch(err){
        alert("❌ Erro ao importar backup: "+err.message);
      }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const testConnection=async()=>{
    setSyncStatus("syncing");setSyncMsg("Testando conexão...");
    const url=urlDraft.trim();
    try{
      const r=await fetch(`${url}?key=test`);
      await r.text();
      setSyncStatus("ok");setSyncMsg("Conexão OK! ✓");
    }catch{
      setSyncStatus("error");setSyncMsg("Falha na conexão ✗");
    }
    setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
  };

  const forceSync=async()=>{
    if(!sheetsUrl){alert("⚠️ Nuvem não configurada.");return;}
    if(!confirm("Isso irá substituir os dados atuais pelos dados salvos na nuvem. Continuar?"))return;
    setSyncStatus("syncing");setSyncMsg("🔄 Baixando tudo da nuvem...");
    try{
      const [cnf,cfr,cped,csol,ccal]=await Promise.all([
        cloudLoad(STORAGE_NF),cloudLoad(STORAGE_FR),cloudLoad(STORAGE_PED_V2),
        cloudLoad(STORAGE_SOL_V2),cloudLoad(STORAGE_CAL_V1),
      ]);
      let count=0;
      if(cnf&&Array.isArray(cnf)){setNfs(cnf);localStorage.setItem(STORAGE_NF,JSON.stringify(cnf));count++;}
      if(cfr&&Array.isArray(cfr)){setFretes(cfr);localStorage.setItem(STORAGE_FR,JSON.stringify(cfr));count++;}
      if(cped&&Array.isArray(cped)&&cped.length>0){localStorage.setItem(STORAGE_PED_V2,JSON.stringify(cped));count++;}
      if(csol&&Array.isArray(csol)&&csol.length>0){localStorage.setItem(STORAGE_SOL_V2,JSON.stringify(csol));count++;}
      if(ccal&&typeof ccal==="object"&&Object.keys(ccal).length>0){localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(ccal));count++;}
      setSyncStatus("ok");
      const needsReload=count>2;
      setSyncMsg(needsReload?"✅ Sincronizado! Recarregando...":"✅ NFs e Fretes atualizados!");
      if(needsReload){sessionStorage.setItem("backup_just_restored","1");setTimeout(()=>window.location.reload(),2000);}
      else setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},3000);
    }catch(err){
      setSyncStatus("error");setSyncMsg("❌ Erro: "+err.message);
      setTimeout(()=>{setSyncStatus("idle");setSyncMsg("");},4000);
    }
  };

    const tabs=[{id:"pedidos",label:"📦 Pedidos",color:"#f59e0b"},{id:"nf",label:"🧾 NF-e",color:"#cc0000"},{id:"fretes",label:"🚚 Fretes",color:"#ff4444"}];

  const syncDot={idle:{c:"#334155",t:"Sem nuvem"},syncing:{c:"#fbbf24",t:"Sincronizando..."},ok:{c:"#4ade80",t:"Nuvem OK"},error:{c:"#f87171",t:"Erro na nuvem"}};
  const sd=(syncStatus==="idle"&&isConnected)?{c:"#22c55e",t:"Nuvem conectada"}:syncDot[syncStatus];

  return(
    <div style={{fontFamily:"'Barlow','Segoe UI',sans-serif",background:"#0a0a0a",minHeight:"100vh",color:"#e2e8f0"}}>
      <AutoSaveIndicator status={nfsStatus !== 'idle' ? nfsStatus : fretesStatus} />
      {showSettings&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#141414",border:"1px solid #cc0000",borderRadius:12,padding:32,maxWidth:540,width:"100%",boxShadow:"0 8px 40px rgba(204,0,0,0.3)"}}>
            <h2 style={{color:"#cc0000",fontWeight:900,fontSize:18,marginBottom:6}}>⚙️ Integração Google Sheets</h2>
            <p style={{color:"#94a3b8",fontSize:13,marginBottom:20}}>Cole aqui a URL do seu Google Apps Script para sincronizar os dados em qualquer dispositivo.</p>
            <div style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:8,padding:16,marginBottom:20,fontSize:12}}>
              <div style={{color:"#f59e0b",fontWeight:700,marginBottom:8}}>📋 Como configurar (1 vez só):</div>
              <ol style={{color:"#94a3b8",lineHeight:2,paddingLeft:18}}>
                <li>Abra sua planilha no Google Sheets</li>
                <li>Clique em <strong style={{color:"#fff"}}>Extensões → Apps Script</strong></li>
                <li>Apague o conteúdo e cole o script abaixo</li>
                <li>Clique em <strong style={{color:"#fff"}}>Implantar → Nova implantação</strong></li>
                <li>Tipo: <strong style={{color:"#fff"}}>App da Web</strong> → Quem pode acessar: <strong style={{color:"#fff"}}>Qualquer pessoa</strong></li>
                <li>Copie a URL gerada e cole abaixo</li>
              </ol>
            </div>
            <div style={{background:"#0a0a0a",border:"1px solid #2a2a2a",borderRadius:8,padding:14,marginBottom:20,fontFamily:"monospace",fontSize:11,color:"#67e8f9",maxHeight:160,overflowY:"auto",whiteSpace:"pre-wrap",userSelect:"all"}}>
{`function doGet(e){
  const key=e.parameter.key;
  if(!key||key==="test")return out("ok");
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  let sh=ss.getSheetByName("MasterEPI");
  if(!sh)sh=ss.insertSheet("MasterEPI");
  const rows=sh.getDataRange().getValues();
  for(let r of rows){if(r[0]===key)return out(r[1]);}
  return out("null");
}
function doPost(e){
  try{
    const raw=e.postData?e.postData.contents:"{}";
    const b=JSON.parse(raw);
    if(!b.key)return out("error:no key");
    const val=JSON.stringify(b.value);
    const ss=SpreadsheetApp.getActiveSpreadsheet();
    let sh=ss.getSheetByName("MasterEPI");
    if(!sh)sh=ss.insertSheet("MasterEPI");
    const data=sh.getDataRange().getValues();
    for(let i=0;i<data.length;i++){
      if(data[i][0]===b.key){
        sh.getRange(i+1,2).setValue(val);
        SpreadsheetApp.flush();
        return out("ok");
      }
    }
    sh.appendRow([b.key,val]);
    SpreadsheetApp.flush();
    return out("ok");
  }catch(err){return out("error:"+err.toString());}
}
function out(v){
  return ContentService.createTextOutput(v)
    .setMimeType(ContentService.MimeType.TEXT);
}`}
            </div>
            <div style={{marginBottom:14}}>
              <label style={{color:"#94a3b8",fontSize:12,display:"block",marginBottom:6}}>URL do Apps Script:</label>
              <input value={urlDraft} onChange={e=>setUrlDraft(e.target.value)}
                placeholder="https://script.google.com/macros/s/..."
                style={{width:"100%",background:"#0a0a0a",border:"1px solid #334155",borderRadius:8,padding:"10px 14px",color:"#e2e8f0",fontSize:13,boxSizing:"border-box"}}/>
            </div>
            {syncMsg&&<p style={{fontSize:12,color:syncStatus==="ok"?"#4ade80":syncStatus==="error"?"#f87171":"#fbbf24",marginBottom:12}}>{syncMsg}</p>}
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <button onClick={testConnection} style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>🔗 Testar conexão</button>
              <button onClick={saveUrl} style={{background:"#cc0000",color:"#fff",border:"none",padding:"9px 20px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>💾 Salvar e conectar</button>
              {sheetsUrl&&<button onClick={()=>{localStorage.removeItem(STORAGE_SHEETS_URL);setSheetsUrl("");setUrlDraft("");setShowSettings(false);}} style={{background:"transparent",color:"#64748b",border:"1px solid #334155",padding:"9px 16px",borderRadius:8,cursor:"pointer",fontSize:12}}>Desconectar</button>}
              <button onClick={()=>setShowSettings(false)} style={{background:"transparent",color:"#555",border:"1px solid #2a2a2a",padding:"9px 16px",borderRadius:8,cursor:"pointer",fontSize:12,marginLeft:"auto"}}>Fechar</button>
            </div>
            <div style={{marginTop:20,borderTop:"1px solid #1a1a1a",paddingTop:16}}>
              <div style={{color:"#f59e0b",fontWeight:700,fontSize:12,marginBottom:10}}>💾 Backup Manual dos Dados</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <button onClick={exportarBackup} style={{background:"#1c1200",color:"#fbbf24",border:"1px solid #ca8a04",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>⬇️ Exportar Backup (.json)</button>
                <label style={{background:"#0c2a3a",color:"#67e8f9",border:"1px solid #0891b2",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>
                  ⬆️ Restaurar Backup
                  <input type="file" accept=".json" onChange={importarBackup} style={{display:"none"}}/>
                </label>
                <span style={{fontSize:11,color:"#475569"}}>Faça backup antes de atualizar o site!</span>
              </div>
            </div>
          </div>
        </div>
      )}

      <div style={{background:"linear-gradient(180deg,#1a0000 0%,#0a0a0a 100%)",padding:"0 0 0",borderBottom:"2px solid #cc0000",boxShadow:"0 2px 20px rgba(204,0,0,0.3)"}}>
        <div style={{display:"flex",alignItems:"center",gap:16,padding:"16px 28px 0"}}>
          <img src={LOGO_SRC} alt="Master EPI" style={{height:64,width:64,objectFit:"contain",borderRadius:8}}/>
          <div style={{flex:1}}>
            <p style={{margin:0,fontSize:11,color:"#888",letterSpacing:2,textTransform:"uppercase"}}>Controle Diário &nbsp;·&nbsp; Belém do Pará &nbsp;·&nbsp; {today()}</p>
          </div>
          <button onClick={forceSync} title="Sincronizar todos os dados agora" style={{background:"#141414",border:"1px solid #cc0000",borderRadius:8,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,color:"#ff9999",fontSize:12,fontWeight:600,marginRight:8}}>
            <span style={{display:"inline-block",animation:syncStatus==="syncing"?"spin 1s linear infinite":"none"}}>🔄</span>
            Sincronizar
          </button>
          <button onClick={()=>setShowSettings(true)} title={sd.t} style={{background:"#141414",border:`1px solid ${isConnected?"#cc0000":"#2a2a2a"}`,borderRadius:8,padding:"8px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,color:isConnected?"#fff":"#555",fontSize:12,fontWeight:600}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:sd.c,display:"inline-block",boxShadow:syncStatus==="syncing"?"0 0 8px #fbbf24":"none"}}/>
            {isConnected?"☁️ Nuvem":"☁️ Configurar Nuvem"}
          </button>
        </div>
        <div style={{display:"flex",gap:4,padding:"0 28px",marginTop:14}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>{setTab(t.id);if(t.id!=="nf")setHighlightNF(null);if(t.id!=="pedidos")setHighlightPedido(null);}} style={{padding:"10px 24px",border:"none",borderRadius:"8px 8px 0 0",cursor:"pointer",fontWeight:700,fontSize:14,letterSpacing:0.5,background:tab===t.id?"#0a0a0a":"transparent",color:tab===t.id?"#cc0000":"#666",borderBottom:tab===t.id?"2px solid #cc0000":"2px solid transparent",transition:"all 0.15s",textTransform:"uppercase"}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:"24px 28px"}}>
        {tab==="nf"&&<NfTab nfs={nfs} setNfs={setNfs} fretes={fretes} setFretes={setFretes} highlightNF={highlightNF} onHighlightDone={()=>setHighlightNF(null)} navegarParaPedido={navegarParaPedido} onChegouSync={onChegouSync}/>}
        {tab==="fretes"&&<FretesTab fretes={fretes} setFretes={setFretes} nfs={nfs} setNfs={setNfs} onChegouSync={onChegouSync}/>}
        {tab==="pedidos"&&<PedidosTab sheetsUrl={sheetsUrl} nfs={nfs} setNfs={setNfs} fretes={fretes} setFretes={setFretes} navegarParaNF={navegarParaNF} highlightPedido={highlightPedido} onHighlightPedidoDone={()=>setHighlightPedido(null)} onChegouApply={chegouApply}/>}
      </div>
    </div>

function getDiaAtual(){
  const d=new Date().getDay();
  return ["dom","seg","ter","qua","qui","sex","sab"][d];
}

  const[editando,setEditando]=useState(false);

  const diaAtual=getDiaAtual();
  const marcasHoje=cal[diaAtual]||[];

  useEffect(()=>{
    async function init(){
      if(sheetsUrl){
        const c=await cloudLoad(STORAGE_CAL_V1);
        if(c){setCal(c);setLoaded(true);return;}
      }
      try{const s=localStorage.getItem(STORAGE_CAL_V1);if(s){setCal(JSON.parse(s));setLoaded(true);return;}}catch{}
      setLoaded(true);
    }
    init();
  },[sheetsUrl]);

  useEffect(()=>{
    if(!loaded)return;
    try{localStorage.setItem(STORAGE_CAL_V1,JSON.stringify(cal));}catch{}
    if(sheetsUrl)cloudSave(STORAGE_CAL_V1,cal);
  },[cal,loaded]);

  const addMarca=(dia)=>{
    const m=novaMarca.trim().toUpperCase();
    if(!m)return;
    setCal(prev=>({...prev,[dia]:[...(prev[dia]||[]),m]}));
    setNovaMarca("");
  };

  const removeMarca=(dia,idx)=>{
    setCal(prev=>({...prev,[dia]:(prev[dia]||[]).filter((_,i)=>i!==idx)}));
  };

  const hoje=new Date();
  const inicioSemana=new Date(hoje);
  inicioSemana.setDate(hoje.getDate()-hoje.getDay()+1);
  inicioSemana.setHours(0,0,0,0);

  const pedidosSemana=(marca)=>{
    const marcaUpper=marca.toUpperCase();
    return grupos.filter(g=>{
      if(!g.dataPedido)return false;
      const [dd,mm,yyyy]=g.dataPedido.split("/");
      const dt=new Date(`${yyyy}-${mm}-${dd}`);
      const fornUpper=(g.fornecedor||"").toUpperCase();
      return dt>=inicioSemana && (fornUpper.includes(marcaUpper)||marcaUpper.includes(fornUpper.split(" ")[0]));
    });
  };
  const todosPedidosMarca=(marca)=>{
    const marcaUpper=marca.toUpperCase();
    return grupos.filter(g=>{

    }).sort((a,b)=>{ const pa=a.dataPedido||"",pb=b.dataPedido||""; return pb.split("/").reverse().join("")-pa.split("/").reverse().join(""); });
  };
